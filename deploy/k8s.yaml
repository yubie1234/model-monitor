# model-monitor in-cluster 배포 매니페스트
# 전제: 이미지가 레지스트리(10.92.20.77:5002)에 올라가 있어야 한다.
#   ./ci.sh && ./push.sh
#   # imagePullPolicy: Always 라 latest 최신본을 매번 받는다
#   # HTTP(비TLS) 레지스트리면 노드 containerd 에 insecure-registry(10.92.20.77:5002) 설정 필요
# 적용:
#   kubectl apply -f k8s.yaml
#   # config(LiteLLM 주소·api_key)는 아래 ConfigMap 의 값을 실제 값으로 교체할 것
---
apiVersion: v1
kind: Namespace
metadata:
  name: model-monitor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-monitor
  namespace: model-monitor
---
# LB 뒤 backend Pod 개수 조회에 필요한 최소 권한.
# 핵심은 endpointslices(1순위). 나머지는 모드 감지/보정용.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: model-monitor-reader
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["endpoints", "services"]   # 구버전 폴백 + selector 확인
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]                    # GPU 개수: Pod resources.limits[nvidia.com/gpu]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]                   # GPU 장치명: 노드 라벨 nvidia.com/gpu.product
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]             # 라벨 합산 + RawDeployment 보정
    verbs: ["get", "list"]                  # list: serving.kserve.io/inferenceservice 라벨 조회
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]       # deploymentMode / revision 감지
    verbs: ["get", "list"]
  - apiGroups: ["serving.knative.dev"]
    resources: ["revisions"]               # Serverless 보정
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling.internal.knative.dev"]
    resources: ["podautoscalers"]          # Serverless 실시간 actualScale
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: model-monitor-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: model-monitor-reader
subjects:
  - kind: ServiceAccount
    name: model-monitor
    namespace: model-monitor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-monitor-config
  namespace: model-monitor
data:
  config.json: |
    {
      "litellm": {
        "url": "http://litellm.litellm.svc.cluster.local:4000",
        "api_key": "REPLACE_WITH_ADMIN_KEY"
      },
      "backend_count": {
        "default_namespace": "kserve",
        "activator_namespace": "knative-serving"
      }
    }
---
# /metrics 스크레이프용 Bearer 토큰 Secret — 항상 생성해 둔다.
# 키 필수 모드(user_view)가 아니면 /metrics 는 인증을 요구하지 않으므로 있어도 무해하고,
# user_view 를 켜는 순간 PodMonitor(prometheus-alerts.yaml authorization)가 그대로 동작한다.
# 값은 예시 — 운영에서는 반드시 랜덤 문자열로 교체할 것.
apiVersion: v1
kind: Secret
metadata:
  name: model-monitor-metrics-token
  namespace: model-monitor
  labels:
    app: model-monitor
    app.kubernetes.io/name: model-monitor
type: Opaque
stringData:
  token: "model-monitor-metrics-example-token-CHANGE-ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-monitor
  namespace: model-monitor
  labels:
    app: model-monitor
    app.kubernetes.io/name: model-monitor
    app.kubernetes.io/version: "0.5.8"
spec:
  replicas: 1
  selector:
    matchLabels: { app: model-monitor }
  template:
    metadata:
      labels:
        app: model-monitor
        app.kubernetes.io/name: model-monitor
        app.kubernetes.io/version: "0.5.8"
    spec:
      serviceAccountName: model-monitor
      containers:
        - name: model-monitor
          # ci.sh 로 빌드 -> push.sh 로 레지스트리에 올린 이미지.
          # ENTRYPOINT 가 uvicorn app.main:app (포트 8088) 이라, 설정은 env 로 주입한다.
          image: 10.92.20.77:5002/ai-tool/model-monitor:latest
          # latest 를 쓰므로 매번 레지스트리에서 최신본을 받는다.
          imagePullPolicy: Always
          env:
            # 중첩 설정(litellm/backend_count/user_view/metrics)은 config 파일에서 읽는다.
            - { name: MONITOR_CONFIG_FILE, value: "/etc/model-monitor/config.json" }
            - { name: MONITOR_INTERVAL, value: "5" }
            # LiteLLM /health 폴링 끄기. /health 는 모든 백엔드를 실제 ping 하는데,
            # KServe Serverless(scale-to-zero) 백엔드를 주기적으로 깨워 scale 동작을
            # 방해한다. 끄면 백엔드를 건드리지 않고 상태는 k8s readiness(Knative
            # actualScale)로 판정 — scale-to-zero 는 idle('?'), ready>0 은 UP.
            # 백엔드가 전부 상시 기동(non-serverless)이고 /health 상태가 필요하면 "true".
            - { name: MONITOR_HEALTH, value: "false" }
            # path prefix 뒤 노출(아래 Ingress 와 동일 prefix). 루트로 쓰려면 이 줄 제거.
            # Ingress 가 prefix 를 rewrite 로 떼고 앱에 전달하지만, 대시보드 자기 호출 URL·
            # /docs 링크가 prefix 를 포함하도록 앱에도 같은 값을 알려준다.
            - { name: MONITOR_ROOT_PATH, value: "/service/model-monitor" }
            # 키 필수 모드(user_view)에서 Prometheus 가 admin 키 없이 /metrics 를
            # 스크레이프하게 하는 전용 Bearer 토큰(위 model-monitor-metrics-token Secret).
            # PodMonitor authorization(prometheus-alerts.yaml)과 같은 Secret 을 참조한다.
            # user_view 를 안 쓰면 토큰은 무시되므로 항상 주입해 둔다.
            - name: MONITOR_METRICS_TOKEN
              valueFrom:
                secretKeyRef: { name: model-monitor-metrics-token, key: token }
          ports:
            - { containerPort: 8088, name: http }
          readinessProbe:
            httpGet: { path: /readyz, port: 8088 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8088 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          volumeMounts:
            - { name: config, mountPath: /etc/model-monitor }
      volumes:
        - name: config
          configMap: { name: model-monitor-config }
---
apiVersion: v1
kind: Service
metadata:
  name: model-monitor
  namespace: model-monitor
spec:
  selector: { app: model-monitor }
  ports:
    - { port: 80, targetPort: 8088, name: http }
---
# path prefix 뒤로 노출: http(s)://<any-host>/service/model-monitor  (host 미지정 = 모든 도메인)
#
# 동작: nginx ingress 가 prefix(/service/model-monitor)를 rewrite 로 떼고 앱(루트)에
#       전달한다. 앱은 MONITOR_ROOT_PATH 로 같은 prefix 를 알고 있어, 대시보드 자기
#       호출(fetch /api/snapshot 등)과 /docs 링크에 prefix 를 붙여 브라우저가
#       <host>/service/model-monitor/... 로 요청 -> ingress 가 다시 떼어 앱에 전달.
#
# 전제: nginx ingress controller. 다른 컨트롤러면 rewrite 주석/문법을 맞게 바꿀 것.
#   - host 미지정이라 모든 도메인을 받는다. 특정 도메인만 받으려면 rules 에 host: 추가.
#     ingressClassName(nginx) 은 실제 환경 값으로 교체.
#   - TLS 를 쓰면 spec.tls 블록 추가(SNI 상 TLS 는 특정 도메인이 필요 — any-host 와 별개).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: model-monitor
  namespace: model-monitor
  annotations:
    # 캡처 그룹 $2(= prefix 뒤 나머지 경로)로 rewrite -> 앱은 루트(/...) 로 받는다.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    # host 미지정 = 모든 도메인(Host 헤더 무관) 매칭. 특정 도메인만 받으려면 host: 추가.
    - http:
        paths:
          # /service/model-monitor 와 그 하위 전체를 매칭(정규식). $2 = 나머지 경로.
          - path: /service/model-monitor(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: model-monitor
                port:
                  number: 80
# TLS 예시(인증서 Secret 준비 후 주석 해제):
# spec:
#   tls:
#     - hosts: [<도메인>]          # TLS 는 특정 도메인 필요(any-host 와 별개)
#       secretName: model-monitor-tls

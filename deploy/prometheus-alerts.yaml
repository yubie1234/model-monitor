# model-monitor — Prometheus 스크레이프 설정 + 알림 룰 예시
#
# model-monitor 는 /metrics 를 노출한다(기본 ON, 끄려면 MONITOR_METRICS=false).
# 요청 경로에서 수집하지 않고 백그라운드 캐시 스냅샷을 포맷만 하므로 스크레이프가 가볍다.
#
# 이 파일은 두 가지를 담는다:
#   1) scrape_config 예시 (prometheus.yml 의 scrape_configs 에 추가)
#   2) alerting rules (rule_files 로 로드, 또는 kube-prometheus-stack 의 PrometheusRule)
# ---------------------------------------------------------------------------

# === 1) 스크레이프 설정 (prometheus.yml) ===================================
# scrape_configs:
#   - job_name: model-monitor
#     metrics_path: /metrics
#     scrape_interval: 30s          # model-monitor refresh interval 과 맞추거나 약간 길게
#     static_configs:
#       - targets: ["model-monitor:8088"]
#     # MONITOR_USER_VIEW=true("키 필수 모드")로 띄운 경우, /metrics 는 인증이 필요하다.
#     # LiteLLM admin 키를 Prometheus 에 배포하지 말고, 모니터에 MONITOR_METRICS_TOKEN
#     # (metrics 조회만 가능한 전용 토큰)을 설정한 뒤 표준 Bearer 인증으로 스크레이프한다.
#     # (평문 노출 방지 위해 TLS 뒤에서만.)
#     # authorization:                                          # Authorization: Bearer <token>
#     #   credentials_file: /etc/prometheus/model-monitor-metrics-token
#     # (admin 키 헤더 X-LiteLLM-Key 도 여전히 유효하지만 권장하지 않음 — 유출 시
#     #  metrics 만이 아니라 전체 스냅샷/export 가 열린다.)

# k8s 에서 ServiceMonitor(kube-prometheus-stack)를 쓰면(PodMonitor 대신 Service 경유):
# ---
# apiVersion: monitoring.coreos.com/v1
# kind: ServiceMonitor
# metadata:
#   name: model-monitor
#   labels: {release: kube-prometheus-stack}
# spec:
#   selector:
#     matchLabels: {app: model-monitor}
#   endpoints:
#     - port: http
#       path: /metrics
#       interval: 30s
#       relabelings:                    # up{job="model-monitor"} 알럿용(아래 PodMonitor 와 동일)
#         - {targetLabel: job, replacement: model-monitor}

# === 1b) PodMonitor / metrics 토큰 Secret → deploy/k8s.yaml ================
# 활성 PodMonitor(표준 Bearer authorization 포함)와 metrics 토큰 Secret
# (model-monitor-metrics-token)은 core 매니페스트인 k8s.yaml 로 이동했다 —
# Deployment·Service 와 함께 배포되고, Deployment env MONITOR_METRICS_TOKEN 과
# PodMonitor authorization 이 같은 Secret 을 참조한다(항상 활성, 예시값은 교체).
# 위 ServiceMonitor 예시를 쓸 거면 PodMonitor 와 둘 중 하나만 활성화할 것.
# 이 파일에는 Prometheus Operator 없이도 쓸 수 있는 scrape_config 예시(위 1)와
# 알림 룰(아래 2)만 남긴다.

# === 2) 알림 룰 (PrometheusRule / rule_files) ==============================
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: model-monitor-rules
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: model-monitor.rules
      rules:
        # 진짜 DOWN: UP=0 이면서 scale-to-zero 정상 idle 이 아닌 모델.
        # scale_to_zero==1(정상 idle)은 제외 → 오탐 방지(이 모니터만 아는 구분).
        - alert: ModelDown
          expr: |
            model_monitor_model_up == 0
            and on(model) model_monitor_model_scale_to_zero == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "모델 DOWN: {{ $labels.model }}"
            description: "{{ $labels.model }} ({{ $labels.namespace }}/{{ $labels.service }}) 가 5분 이상 DOWN. scale-to-zero idle 아님."

        # LB 는 UP(200)인데 뒤에 ready Pod 가 0 — /health 가 LB 만 찔러 'UP'으로 보이는 함정.
        # scale-to-zero idle 은 제외.
        - alert: BackendPodsZeroWhileUp
          expr: |
            (model_monitor_model_up == 1)
            and on(model) (model_monitor_model_scale_to_zero == 0)
            and on(model, namespace, service) (model_monitor_model_backend_pods_ready == 0)
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "LB UP인데 backend Pod 0: {{ $labels.model }}"
            description: "{{ $labels.model }} 의 LB 는 응답하지만 ready Pod 가 0 (scale-to-zero 아님). 요청이 실패할 수 있음."

        # 용량 저하: ready/desired 비율이 낮음(개별 Service 가 아니라 전체 합 기준).
        - alert: BackendCapacityDegraded
          expr: |
            model_monitor_backend_pods_ready_total
              / clamp_min(model_monitor_backend_pods_desired_total, 1) < 0.8
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Backend Pod 가용률 저하 (<80%)"
            description: "ready/desired = {{ $value | humanizePercentage }}. 일부 Pod 가 빠졌거나 스케줄 안 됨."

        # 모니터 자체가 안 보임(스크레이프 실패) — 메트릭 부재가 '정상'으로 오인되지 않게.
        - alert: ModelMonitorDown
          expr: up{job="model-monitor"} == 0 or model_monitor_up == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "model-monitor 가 응답하지 않음"
            description: "스크레이프 실패 또는 첫 수집 전. 대시보드 데이터가 stale 일 수 있음."

        # 수집 에러: k8s 조회가 일부 깨짐 → Pod 수가 부정확할 수 있음.
        - alert: ModelMonitorCollectErrors
          expr: model_monitor_collect_errors > 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "model-monitor k8s 수집 에러 {{ $value }}건"
            description: "일부 deployment 의 backend Pod 수가 부정확할 수 있음(RBAC/연결 확인)."

        # GPU 수집 에러: nodes/pods RBAC·연결 문제로 GPU 수치가 광범위하게 깨짐.
        - alert: ModelMonitorGpuCollectErrors
          expr: model_monitor_gpu_collect_errors > 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "model-monitor GPU 수집 에러 {{ $value }}건"
            description: "일부 deployment 의 GPU 수치가 부정확할 수 있음(pods/nodes RBAC 확인)."

        # 최상류 단일 의존성(LiteLLM) 미도달 — 죽으면 model_* 시리즈가 통째로
        # 사라져(0 이 아니라 부재) ModelDown 이 안 걸리므로 별도로 잡는다.
        - alert: LiteLLMUnreachable
          expr: model_monitor_litellm_reachable == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "LiteLLM 게이트웨이 미도달"
            description: "model-monitor 가 LiteLLM 에 도달하지 못함 — 모델 목록·상태 갱신 불가."

        # 스냅샷 정체(staleness): 스크레이프는 되는데(model_monitor_up=1) 백그라운드
        # Refresher 가 멈춰 데이터가 낡음. age 가 refresh interval 을 크게 초과.
        - alert: ModelMonitorSnapshotStale
          expr: model_monitor_snapshot_age_seconds > 300
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "model-monitor 스냅샷이 낡음 ({{ $value | humanizeDuration }})"
            description: "폴링은 되지만 새 스냅샷을 만들지 못함 — 표시 데이터가 stale."

        # 마지막 백그라운드 수집이 실패 상태로 직전 스냅샷을 서빙 중.
        - alert: ModelMonitorCollectFailing
          expr: model_monitor_collect_failing == 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "model-monitor 백그라운드 수집 실패 지속"
            description: "직전 스냅샷을 계속 서빙 중 — 원인 확인(로그·LiteLLM·k8s)."

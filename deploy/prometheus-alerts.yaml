# model-monitor — Prometheus 스크레이프 설정 + 알림 룰 예시
#
# model-monitor 는 --serve 시 /metrics 를 노출한다(기본 ON, 끄려면 --no-metrics).
# 요청 경로에서 수집하지 않고 백그라운드 캐시 스냅샷을 포맷만 하므로 스크레이프가 가볍다.
#
# 이 파일은 두 가지를 담는다:
#   1) scrape_config 예시 (prometheus.yml 의 scrape_configs 에 추가)
#   2) alerting rules (rule_files 로 로드, 또는 kube-prometheus-stack 의 PrometheusRule)
# ---------------------------------------------------------------------------

# === 1) 스크레이프 설정 (prometheus.yml) ===================================
# scrape_configs:
#   - job_name: model-monitor
#     metrics_path: /metrics
#     scrape_interval: 30s          # model-monitor refresh interval 과 맞추거나 약간 길게
#     static_configs:
#       - targets: ["model-monitor:8088"]
#     # --enable-user-view("키 필수 모드")로 띄운 경우, /metrics 도 admin 키 헤더가 필요하다.
#     # 그때만 아래 헤더를 추가한다(평문 노출 방지 위해 TLS 뒤에서만).
#     # authorization:
#     #   credentials_file: /etc/prometheus/litellm-admin-key   # 또는
#     # http_headers:
#     #   X-LiteLLM-Key:
#     #     values: ["sk-admin-..."]

# k8s 에서 ServiceMonitor(kube-prometheus-stack)를 쓰면:
# ---
# apiVersion: monitoring.coreos.com/v1
# kind: ServiceMonitor
# metadata:
#   name: model-monitor
#   labels: {release: kube-prometheus-stack}
# spec:
#   selector:
#     matchLabels: {app: model-monitor}
#   endpoints:
#     - port: http
#       path: /metrics
#       interval: 30s

# === 2) 알림 룰 (PrometheusRule / rule_files) ==============================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: model-monitor-rules
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: model-monitor.rules
      rules:
        # 진짜 DOWN: UP=0 이면서 scale-to-zero 정상 idle 이 아닌 모델.
        # scale_to_zero==1(정상 idle)은 제외 → 오탐 방지(이 모니터만 아는 구분).
        - alert: ModelDown
          expr: |
            model_monitor_model_up == 0
            and on(model) model_monitor_model_scale_to_zero == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "모델 DOWN: {{ $labels.model }}"
            description: "{{ $labels.model }} ({{ $labels.namespace }}/{{ $labels.service }}) 가 5분 이상 DOWN. scale-to-zero idle 아님."

        # LB 는 UP(200)인데 뒤에 ready Pod 가 0 — /health 가 LB 만 찔러 'UP'으로 보이는 함정.
        # scale-to-zero idle 은 제외.
        - alert: BackendPodsZeroWhileUp
          expr: |
            (model_monitor_model_up == 1)
            and on(model) (model_monitor_model_scale_to_zero == 0)
            and on(model, namespace, service) (model_monitor_model_backend_pods_ready == 0)
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "LB UP인데 backend Pod 0: {{ $labels.model }}"
            description: "{{ $labels.model }} 의 LB 는 응답하지만 ready Pod 가 0 (scale-to-zero 아님). 요청이 실패할 수 있음."

        # 용량 저하: ready/desired 비율이 낮음(개별 Service 가 아니라 전체 합 기준).
        - alert: BackendCapacityDegraded
          expr: |
            model_monitor_backend_pods_ready_total
              / clamp_min(model_monitor_backend_pods_desired_total, 1) < 0.8
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Backend Pod 가용률 저하 (<80%)"
            description: "ready/desired = {{ $value | humanizePercentage }}. 일부 Pod 가 빠졌거나 스케줄 안 됨."

        # 모니터 자체가 안 보임(스크레이프 실패) — 메트릭 부재가 '정상'으로 오인되지 않게.
        - alert: ModelMonitorDown
          expr: up{job="model-monitor"} == 0 or model_monitor_up == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "model-monitor 가 응답하지 않음"
            description: "스크레이프 실패 또는 첫 수집 전. 대시보드 데이터가 stale 일 수 있음."

        # 수집 에러: k8s 조회가 일부 깨짐 → Pod 수가 부정확할 수 있음.
        - alert: ModelMonitorCollectErrors
          expr: model_monitor_collect_errors > 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "model-monitor k8s 수집 에러 {{ $value }}건"
            description: "일부 deployment 의 backend Pod 수가 부정확할 수 있음(RBAC/연결 확인)."

# model_monitor 설정 예시 (YAML).
# PyYAML 이 없는 노드에서는 config.example.json 을 쓰세요. 내용은 동일합니다.

litellm:
  url: "http://litellm.litellm.svc.cluster.local:4000"
  # admin 권한 키를 쓰면 /health 까지 조회 가능. 키 없이도 /v1/models 는 동작.
  api_key: "sk-1234"

# 백엔드를 LiteLLM 을 거치지 않고 직접 확인하고 싶을 때 (--probe-backends 또는 아래 probe_backends: true)
probe_backends: true
backends:
  - name: llama-3.1-8b
    url: "http://llama-8b-predictor.kserve.svc.cluster.local:8080"
    type: vllm        # vllm | sglang (표시용)
  - name: qwen2.5-32b
    url: "http://qwen-32b-predictor.kserve.svc.cluster.local:8080"
    type: sglang
    # api_key: "..."   # 백엔드가 키를 요구하면

# --- 지금 부하 (기본 켜짐) ---
# 백엔드 엔진 게이지(vLLM/SGLang)를 Pod 마다 직접 읽어 "지금 바쁜가"를 판정한다.
# Pod 주소는 EndpointSlice 에서 얻는다. 못 얻으면 LB 로 1개만 샘플링하고 그 사실을 표시한다.
# 끄려면 실행 시 --no-load.
load:
  enabled: true
  timeout: 3           # Pod /metrics 조회 타임아웃(초). 죽은 Pod 가 갱신을 막지 않게 짧게.
  threads: 12          # 동시 scrape 수. 한 라운드 최악 = ceil(Pod수/threads) * timeout.
  thresholds:          # 부하 등급 판정 기준
    queue_busy: 1      # 대기 요청이 1개라도 있으면 BUSY (이미 밀리는 중)
    queue_saturated: 5 # 큐가 이만큼 쌓이면 FULL
    kv_busy: 80        # KV 캐시 사용률(%)
    kv_saturated: 95

# --- Prometheus 폴백 (선택) ---
# Pod /metrics 를 직접 못 읽을 때(NetworkPolicy·mTLS·메트릭 비활성) 같은 게이지를
# Prometheus 에서 대신 읽는다. 출처가 같아 정확도는 동일하고 스크레이프 주기만큼 늦다.
# prometheus:
#   url: "http://prometheus-operated.monitoring.svc:9090"
#   first: false        # true 면 Pod 직접 조회를 건너뛰고 Prometheus 만 사용
#   lookback: "2m"      # 이 구간 안에 샘플이 없으면 '모름'(옛날 값을 지금으로 쓰지 않음)
#   timeout: 10
#   labels:             # 스크레이프 설정에 따라 라벨 이름이 다르면 여기서 교정
#     namespace: "namespace"
#     pod: "pod"
#     service: "service"

# --- 누적 사용량(요청 수/토큰): 기본 꺼짐 ---
# "지금 부하"와 다른 축이고, LiteLLM 에 DB(LiteLLM_SpendLogs)가 있어야 나온다.
# 켜려면 enabled: true 또는 실행 시 --usage.
usage:
  enabled: false
  window_hours: 24     # 집계 구간(시간). --usage-window 로 덮어쓸 수 있다.

# --- LB(api_base) 뒤의 실제 backend Pod 개수 수집 ---
# 기본은 auto: in-cluster ServiceAccount 토큰이 있으면 자동으로 켜짐.
# 끄려면 실행 시 --no-backend-count.
backend_count:
  # api_server: "https://kubernetes.default.svc"   # 보통 자동 감지(env)
  # token_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  # ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
  insecure: false           # TLS 검증 비활성(사설/만료 인증서 탈출구)
  timeout: 5                # k8s API 호출 타임아웃(초)
  default_namespace: "kserve"   # api_base 에서 ns 추론 불가 시 폴백
  activator_namespace: "knative-serving"  # Serverless activator 식별용
  # api_base host -> namespace 매핑 (단축형 주소 보강)
  namespace_overrides:
    qwen3-32b-vllm: "serving"

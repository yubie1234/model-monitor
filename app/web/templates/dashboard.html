<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Monitor — LiteLLM / KServe / vLLM·SGLang</title>
<style>
  :root{
    --bg:#0d1117; --surface:#161b22; --surface2:#1b222c; --border:#232c38;
    --text:#e6edf3; --muted:#8b97a7; --faint:#5b6675;
    --accent:#6e8bff; --up:#3fb950; --down:#f85149; --warn:#d29922;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 22px 60px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:20px}
  h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
  h1 .dim{color:var(--faint);font-weight:400}
  h1 .ver{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);
    background:rgba(110,139,255,.12);border:1px solid rgba(110,139,255,.3);
    border-radius:5px;padding:1px 6px;vertical-align:middle}
  .chain{font-family:var(--mono);font-size:11.5px;color:var(--muted);
    background:var(--surface);border:1px solid var(--border);border-radius:6px;
    padding:3px 9px}
  .spacer{flex:1}
  .meta{font-family:var(--mono);font-size:12px;color:var(--muted);
    display:flex;align-items:center;gap:14px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
  .dot.live{background:var(--up);box-shadow:0 0 0 0 rgba(63,185,80,.5);
    animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.45)}
    70%{box-shadow:0 0 0 6px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  @media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
  .toggle{font-family:var(--sans);font-size:12px;color:var(--muted);cursor:pointer;
    user-select:none;display:flex;align-items:center;gap:6px}
  .toggle input{accent-color:var(--accent)}
  a.exp{font-family:var(--sans);font-size:12px;color:var(--muted);text-decoration:none;
    border:1px solid var(--border);border-radius:6px;padding:3px 9px;cursor:pointer}
  a.exp:hover{color:var(--text);border-color:var(--accent)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;margin-bottom:22px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:14px 16px}
  .card .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted);margin-bottom:7px}
  .card .val{font-family:var(--mono);font-size:26px;font-weight:600;
    font-variant-numeric:tabular-nums;line-height:1}
  .card .sub{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:6px}
  .val.good{color:var(--up)} .val.bad{color:var(--down)} .val.warn{color:var(--warn)}
  .val.accent{color:var(--accent)}

  section{margin-bottom:26px}
  .sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .sec-title .src{font-family:var(--mono);text-transform:none;letter-spacing:0;
    color:var(--faint);font-size:11px}
  /* 접이식 섹션(<details>): summary 를 sec-title 로 쓰고 기본 접힘(open 없음). */
  details.collapsible>summary{cursor:pointer;list-style:none;user-select:none}
  details.collapsible>summary::-webkit-details-marker{display:none}
  details.collapsible:not([open])>summary.sec-title{margin-bottom:0}
  details.collapsible>summary:focus-visible{outline:2px solid var(--accent);
    outline-offset:3px;border-radius:4px}
  .chev{display:inline-block;color:var(--faint);font-size:10px}
  details.collapsible[open] .chev{transform:rotate(90deg)}
  .grp-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);
    background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:0 8px}
  @media (prefers-reduced-motion:no-preference){.chev{transition:transform .15s ease}}
  .filters{display:flex;align-items:center;gap:7px;margin-left:auto;flex-wrap:wrap;
    text-transform:none;letter-spacing:0}
  .filters label{font-size:10px;color:var(--faint)}
  .filters select{font-family:var(--sans);font-size:12px;color:var(--text);
    background:var(--surface2);border:1px solid var(--border);border-radius:6px;
    padding:3px 7px;cursor:pointer}
  /* model_name 검색창 — 표와 그래프에 함께 적용되는 필터(status/net/eng 와 동급) */
  .filters input.search{font-family:var(--sans);font-size:12px;color:var(--text);
    background:var(--surface2);border:1px solid var(--border);border-radius:6px;
    padding:3px 9px;min-width:150px;max-width:230px}
  .filters input.search:focus{outline:none;border-color:var(--accent)}
  .filters input.search::placeholder{color:var(--faint)}
  .filters .fcount{font-family:var(--mono);font-size:11px;color:var(--faint);
    min-width:54px;text-align:right}

  .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:9px;
    background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    text-align:left;font-weight:500;padding:10px 14px;border-bottom:1px solid var(--border);
    white-space:nowrap}
  td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface2)}
  td.mono,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  td.api{font-family:var(--mono);font-size:12px;color:var(--muted);max-width:340px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:copy}
  td.api.copied{color:var(--up)}   /* 클릭 복사 성공 피드백(잠깐 초록) */
  td.name{font-weight:550}
  /* 그래프 노드에 호버하면 표에서 대응하는 행을 하이라이트 (id 특이도로 grp/child 배경 위에 얹음) */
  #deployments tbody tr.hl>td{background:rgba(110,139,255,.16)}
  #deployments tbody tr.hl>td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  /* 노드 클릭(pin) 시 표를 그 노드로 좁혔음을 알리는 칩 — 클릭하면 해제 */
  #pin-badge{margin-left:6px}
  .pinchip{font-family:var(--mono);font-size:10px;color:var(--accent);cursor:pointer;
    background:rgba(110,139,255,.12);border:1px solid rgba(110,139,255,.35);
    border-radius:20px;padding:1px 8px;text-transform:none;letter-spacing:0;white-space:nowrap;
    line-height:1.5;vertical-align:middle}
  .pinchip b{color:var(--muted);font-weight:700;margin-left:3px}
  .pinchip:hover b{color:var(--down)}
  .pinchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
    font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;
    border:1px solid transparent}
  .pill.up{color:var(--up);background:rgba(63,185,80,.10);border-color:rgba(63,185,80,.3)}
  .pill.down{color:var(--down);background:rgba(248,81,73,.10);border-color:rgba(248,81,73,.3)}
  .pill.unk{color:var(--muted);background:rgba(139,151,167,.1);border-color:var(--border)}
  /* 일시중지 = 장애가 아니라 의도적으로 꺼둔 상태. 빨강(장애)과 반드시 구분되게
     accent 계열 + 점선 테두리로 '멈춰 있음' 을 시각적으로 분리한다. */
  .pill.pause{color:var(--accent);background:rgba(110,139,255,.10);
    border-color:rgba(110,139,255,.35);border-style:dashed}
  .chip{font-family:var(--mono);font-size:11px;color:var(--muted);
    background:var(--surface2);border:1px solid var(--border);border-radius:5px;
    padding:1px 7px}
  .chip+.chip{margin-left:4px}
  /* TYPE 2축: 네트워크(kserve/service/external)와 엔진(vllm/sglang) 칩 색 구분 */
  .chip.net{color:#6e8bff;border-color:rgba(110,139,255,.35);background:rgba(110,139,255,.08)}
  .chip.eng{color:#b083f0;border-color:rgba(176,131,240,.35);background:rgba(176,131,240,.08)}
  .chip.mixed{color:var(--warn);border-color:rgba(210,153,34,.35);background:rgba(210,153,34,.08)}

  /* BACKENDS 셀: ready/desired 미니바 + 수치 */
  .bk{display:flex;align-items:center;gap:9px}
  .bk .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;
    min-width:46px}
  .bk .bar{flex:1;max-width:90px;height:6px;border-radius:3px;background:var(--surface2);
    overflow:hidden;border:1px solid var(--border)}
  .bk .bar i{display:block;height:100%;border-radius:3px}
  .bk.good .num{color:var(--up)} .bk.good .bar i{background:var(--up)}
  .bk.warn .num{color:var(--warn)} .bk.warn .bar i{background:var(--warn)}
  .bk.bad .num{color:var(--down)} .bk.bad .bar i{background:var(--down)}
  .bk.zero .num{color:var(--warn)}
  .bk .note{font-size:10.5px;color:var(--faint)}
  .srccol{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .val.gpuval{color:#b083f0}
  /* GPU 장치 칩 (혼합 GPU: 장치별 색) */
  .gchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .gchip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;
    font-weight:600;padding:0 7px;line-height:18px;border-radius:20px;border:1px solid}
  .gchip .dot{width:6px;height:6px;border-radius:50%}
  .gtot{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  /* 헤드라인 GPU 카드: 세그먼트 바 + 범례 */
  .gpusub{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .gbar{display:flex;height:10px;width:100%;max-width:160px;border-radius:4px;
    overflow:hidden;border:1px solid var(--border)}
  .gbar i{display:block;height:100%}
  .glegend{display:flex;gap:9px;flex-wrap:wrap}
  .glegend span{font-family:var(--mono);font-size:10px;color:var(--muted);
    display:inline-flex;align-items:center;gap:4px}
  .glegend i{width:7px;height:7px;border-radius:2px;display:inline-block}

  /* 모델 기준 그룹 뷰 */
  .pill.deg{color:var(--warn);background:rgba(210,153,34,.12);border-color:rgba(210,153,34,.35)}
  /* 지금 부하 — 등급 pill + 근거 */
  .lrefresh{font-family:var(--sans);font-size:12px;color:var(--muted);cursor:pointer;
    background:var(--surface2);border:1px solid var(--border);border-radius:6px;
    padding:3px 9px}
  .lrefresh:hover:not(:disabled){color:var(--text);border-color:var(--accent)}
  .lrefresh:disabled{opacity:.5;cursor:default}
  .lage{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .lage.stale{color:var(--warn)}
  .load{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .load .lv{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;
    border-radius:20px;border:1px solid transparent}
  .load .why{font-size:11px;color:var(--faint)}
  .lv.full{color:var(--down);background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.35)}
  .lv.busy{color:var(--warn);background:rgba(210,153,34,.12);border-color:rgba(210,153,34,.35)}
  .lv.ok{color:var(--up);background:rgba(63,185,80,.10);border-color:rgba(63,185,80,.28)}
  .lv.idle{color:var(--faint);background:var(--surface2);border-color:var(--border)}
  .lv.unk{color:var(--muted);background:var(--surface2);border-color:var(--border)}
  .load .lnum{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;
    color:var(--text)}
  .load .kv{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);
    font-size:11px}
  .load .kvbar{display:inline-block;width:30px;height:5px;border-radius:3px;
    background:var(--surface2);border:1px solid var(--border);overflow:hidden}
  .load .kv i{display:block;height:100%;width:0}
  .load .kv b{font-weight:600}
  .load .kv.good i{background:var(--up)} .load .kv.good b{color:var(--up)}
  .load .kv.warn i{background:var(--warn)} .load .kv.warn b{color:var(--warn)}
  .load .kv.bad i{background:var(--down)} .load .kv.bad b{color:var(--down)}
  .use{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .use .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
  .use .bar{width:46px;height:5px;border-radius:3px;background:var(--surface2);
    overflow:hidden;border:1px solid var(--border)}
  .use .bar i{display:block;height:100%}
  .use.good .num{color:var(--up)} .use.good .bar i{background:var(--up)}
  .use.warn .num{color:var(--warn)} .use.warn .bar i{background:var(--warn)}
  .use.bad .num{color:var(--down)} .use.bad .bar i{background:var(--down)}
  .use.idle .num{color:var(--faint)}

  tr.grp-row td{background:var(--surface);border-top:2px solid var(--border)}
  tr.grp-row:first-child td{border-top:none}
  tr.grp-row td.name{font-weight:600}
  tr.grp-row .nbk{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:8px}
  tr.child-row td{background:#0f141b;font-size:12.5px;padding-top:7px;padding-bottom:7px}
  tr.child-row td.leg{font-family:var(--mono);color:var(--muted);padding-left:26px;position:relative}
  tr.child-row td.leg::before{content:"↳";position:absolute;left:12px;color:var(--faint)}
  tr.child-row td.leg .svc{color:var(--text)}
  .agg{display:flex;align-items:center;gap:9px}
  .agg .lead{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .shared{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--warn);
    background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.35);border-radius:4px;
    padding:0 5px;margin-left:8px;letter-spacing:.02em;white-space:nowrap}

  /* Model ↔ Backend 그래프 + Deployments 를 한 섹션에서 좌우로 (필터 공유) */
  /* 그래프 SVG 는 max-width 600px 라 그 이상은 여백이 된다 — 컬럼을 상한으로 묶고
     남는 폭은 전부 표에 준다(부하·replicas·GPU 컬럼이 스크롤 밖으로 밀리지 않게). */
  .topo-split{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;
    align-items:start}
  /* 그래프 컬럼이 없을 때(숨김·유저뷰·데이터 없음) 표가 전체 폭을 차지 */
  .topo-split.no-graph{grid-template-columns:1fr}
  /* 좁은 화면에선 좌우 분할을 접어 위(그래프)-아래(표)로 쌓는다 */
  @media (max-width:860px){.topo-split{grid-template-columns:1fr}}
  .topo-graph,.topo-table{min-width:0}   /* grid 자식이 컬럼을 넘쳐 스크롤 깨지 않게 */
  /* 그래프·표를 같은 높이 상한(vh) 안에서 각자 스크롤 — 내용이 짧으면 자연 높이(고정 아님)
     라 답답하지 않고, 배포/노드가 많을 때만 컬럼 안에서 스크롤돼 페이지를 밀지 않는다. */
  .topo-graph .graphwrap,
  .topo-table .tablewrap{max-height:72vh;overflow:auto}
  .lbl-sm{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
    font-family:var(--mono);margin:0 0 7px}
  .graphwrap{overflow:auto;max-height:440px;border:1px solid var(--border);border-radius:9px;
    background:#0c1118;padding:6px 8px}
  /* 좌측 컬럼 폭에 맞춰 채우되(min 320) 스택 모드에선 과하게 커지지 않게 상한. */
  .graphwrap svg{display:block;width:100%;height:auto;min-width:320px;max-width:600px;margin:0 auto}
  .glabel{font-family:var(--mono);font-size:9px;fill:var(--muted);
    text-transform:uppercase;letter-spacing:.08em}
  .gnode{cursor:pointer}              /* 클릭하면 포커스 고정(pin) */
  .gnode rect{stroke-width:1.5}
  .gnode.pinned rect{stroke:var(--accent);stroke-width:2.5}  /* 고정된 노드 표시 */
  .gnode .ntext{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--text)}
  .gnode .nsub{font-family:var(--mono);font-size:9px;fill:var(--faint)}
  .gnode.model rect{fill:rgba(110,139,255,.12);stroke:rgba(110,139,255,.55)}
  .gnode.be.up rect{fill:rgba(63,185,80,.10);stroke:rgba(63,185,80,.5)}
  .gnode.be.down rect{fill:rgba(248,81,73,.10);stroke:rgba(248,81,73,.5)}
  .gnode.be.warn rect{fill:rgba(210,153,34,.12);stroke:rgba(210,153,34,.5)}
  .gnode.be.zero rect{fill:rgba(210,153,34,.08);stroke:rgba(210,153,34,.4)}
  .gnode.be.unk rect{fill:var(--surface2);stroke:var(--border)}
  /* 일시중지 백엔드: accent 계열 + 반투명 — 장애(빨강)와 확실히 구분 */
  .gnode.be.paused rect{fill:rgba(110,139,255,.07);stroke:rgba(110,139,255,.45)}
  .gnode.be.paused .ntext{fill:var(--muted)}
  .gnode.be.shared rect{stroke-dasharray:4 3}
  .gedge{stroke:var(--faint);stroke-width:1.6;fill:none;opacity:.5}
  .gedge.shared{stroke:var(--warn);stroke-width:2;opacity:.8}
  .badge-shared{font-family:var(--mono);font-size:9px;font-weight:700;fill:var(--warn)}
  /* 노드에 마우스를 올리면 연결된 노드/간선만 남기고(나머지는 숨김) 연결된 노드들을
     hovered 노드 y 중심으로 끌어모아, 멀리 떨어져 있어도 무엇과 이어졌는지 바로
     보이게 한다(이동/재배선은 wireGraph). 숨긴 노드도 hit-area 는 살아 있어 컬럼을
     훑으면 떠오른다. */
  svg.focusing .gedge{opacity:0}
  svg.focusing .gnode{opacity:0}
  svg.focusing .gedge.on{opacity:.95}
  svg.focusing .gnode.on{opacity:1}
  @media (prefers-reduced-motion:no-preference){
    .gnode{transition:opacity .12s ease, transform .22s cubic-bezier(.4,0,.2,1)}
    .gedge{transition:opacity .12s ease, d .22s ease}
  }

  .empty{color:var(--muted);padding:18px;text-align:center;font-style:italic}
  .err{color:var(--down);font-family:var(--mono);font-size:12px;
    background:rgba(248,81,73,.07);border:1px solid rgba(248,81,73,.25);
    border-radius:7px;padding:9px 12px;margin-top:8px}
  #banner:not(:empty){margin-bottom:16px}
  .note-banner{color:var(--warn);font-family:var(--mono);font-size:12px;
    background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.3);
    border-radius:7px;padding:9px 12px}
  footer{margin-top:30px;color:var(--faint);font-size:11.5px;font-family:var(--mono);
    border-top:1px solid var(--border);padding-top:14px}

  /* per-user(키별) 뷰 바 */
  #userbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:10px 14px;margin-bottom:18px}
  #userbar .uv-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted)}
  #userbar input[type=password]{font-family:var(--mono);font-size:12.5px;
    color:var(--text);background:var(--surface2);border:1px solid var(--border);
    border-radius:6px;padding:5px 10px;min-width:240px;flex:1;max-width:360px}
  #userbar input[type=password]:focus{outline:none;border-color:var(--accent)}
  #userbar button.exp{background:var(--surface2)}
  .uv-status{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .uv-status.ok{color:var(--up)} .uv-status.bad{color:var(--down)}
  .uv-note{font-size:10.5px;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Model Monitor <span class="ver" id="ver"></span></h1>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="auto" checked> auto-refresh</label>
    <a class="exp" id="exp-json" href="__BASE_PATH__/snapshot.json" title="현재 상태를 raw JSON 파일로 다운로드 (공유용)">💾 JSON</a>
    <a class="exp" id="exp-html" href="__BASE_PATH__/snapshot.html" target="_blank" title="현재 상태를 정지된 self-contained 페이지로 열기 (저장해서 공유)">정지 페이지</a>
    <a class="exp" id="exp-user-json" href="#" style="display:none" title="지금 보고 있는 내 키 기준 스냅샷(서버 응답 그대로)을 JSON 으로 다운로드 — 디버그/문의용">🐞 내 뷰 JSON</a>
    <div class="meta">
      <span><span class="dot live" id="livedot"></span><span id="updated">…</span></span>
    </div>
  </header>

  <div id="userbar" style="display:none">
    <span class="uv-title">🔑 키로 조회</span>
    <input id="uv-key" type="password" autocomplete="off" spellcheck="false"
           placeholder="LiteLLM 키 입력 후 Enter (sk-…)">
    <button id="uv-go" class="exp" type="button">조회</button>
    <button id="uv-clear" class="exp" type="button">지우기</button>
    <span class="uv-status" id="uv-status"></span>
    <span class="uv-note">키는 이 브라우저(탭)에만 보관 · 매 요청 헤더로만 전송 · 서버 저장 안 함 · admin 키면 전체 뷰</span>
  </div>

  <div id="banner"></div>

  <div class="cards" id="cards"></div>

  <!-- 그래프(토폴로지)와 Deployments 표를 한 섹션에서 좌우로 — 하나의 필터가 둘을 함께 제어 -->
  <section id="topo-sec">
    <div class="sec-title">Model ↔ Backend
      <span class="filters">
        <input type="search" id="f-search" class="search" autocomplete="off" spellcheck="false"
               aria-label="모델·백엔드 검색"
               placeholder="🔍 모델·백엔드 검색  ( / )"
               title="model_name·service·api_base 로 필터 — 표·그래프에 함께 적용. 단축키 &quot;/&quot;, 지우기 Esc">
        <button class="lrefresh" id="load-refresh" type="button" hidden
                title="지금 부하만 즉시 다시 읽습니다 — 백엔드 Pod 마다 /metrics 를 한 번씩 조회하므로 최소 10초 간격으로 제한됩니다">⟳ 부하</button>
        <span class="lage" id="load-age" hidden></span>
        <label class="toggle" id="f-graph-lbl"><input type="checkbox" id="f-graph" checked> show graph</label>
        <label class="toggle"><input type="checkbox" id="f-group" checked> group by model</label>
        <label for="f-status">status</label>
        <select id="f-status" title="상태로 필터. '이상만'은 정상 확인 안 된 것(DOWN·?)을 한 번에 — 장애 트리아지용이라 의도적으로 꺼둔 PAUSED 는 빼고 본다">
          <option value="">all</option>
          <option value="!UP">이상만 (장애후보)</option>
          <option value="UP">UP</option>
          <option value="DOWN">DOWN</option>
          <option value="PAUSED">PAUSED (비활성)</option>
          <option value="?">?</option>
        </select>
        <label for="f-net">net</label>
        <select id="f-net" title="네트워크 타입: KServe 기반 배포 / 단순 Service(LB) / 클러스터 외부">
          <option value="">all</option>
          <option value="kserve">kserve</option>
          <option value="service">service</option>
          <option value="external">external</option>
          <option value="-">-</option>
        </select>
        <label for="f-eng">engine</label>
        <select id="f-eng" title="서빙 엔진: Pod 컨테이너 이미지(가능하면) 또는 이름으로 판별. mixed=한 백엔드 뒤에 두 엔진 공존(교체 롤아웃 중)">
          <option value="">all</option>
          <option value="vllm">vllm</option>
          <option value="sglang">sglang</option>
          <option value="mixed">mixed</option>
          <option value="-">-</option>
        </select>
        <span class="fcount" id="f-count"></span>
      </span>
    </div>
    <div class="topo-split" id="topo-split">
      <div class="topo-graph" id="graph-col">
        <p class="lbl-sm">라우팅 그래프</p>
        <div class="graphwrap" id="graphwrap"></div>
      </div>
      <div class="topo-table" id="table-col">
        <p class="lbl-sm" id="dep-label">Deployments <span id="pin-badge"></span></p>
        <div class="tablewrap"><table id="deployments">
          <thead></thead><tbody></tbody>
        </table></div>
        <div id="dep-err"></div>
      </div>
    </div>
  </section>

  <section id="groups-sec">
    <details class="collapsible">
      <summary class="sec-title"><span class="chev" aria-hidden="true">▸</span>Model Groups
        <span class="grp-count" id="groups-count"></span></summary>
      <div class="tablewrap"><table id="groups"><thead></thead><tbody></tbody></table></div>
    </details>
  </section>

  <footer id="foot">model_monitor</footer>
</div>

<script>
const REFRESH_MS = __INTERVAL_MS__;
const USER_VIEW = __USER_VIEW__;   // 서버에서 per-user 뷰 활성 여부 주입
// 서비스가 path prefix(예: /service/model-monitor) 뒤에 떠 있으면 그 접두사.
// 대시보드의 모든 자기 호출(fetch/export 링크)에 붙여 prefix 환경에서도 동작한다.
const BASE_PATH = "__BASE_PATH__";
const UV_KEY = "llm_monitor_key";  // 키는 sessionStorage 에만(탭 닫으면 소멸)
const $ = (s)=>document.querySelector(s);
let lastSnap = null;   // 필터 변경 시 재수집 없이 다시 렌더하려고 보관

// 그래프에서 클릭으로 고정(pin)한 노드의 정체성 {kind,key}. wireGraph 지역 상태로만
// 두면 5초 폴링 재렌더(innerHTML 교체)마다 풀린다 — 렌더 밖에 보관하고 재렌더 후
// 복원한다. sessionStorage 라 브라우저 새로고침(F5)에도 유지(탭 닫으면 소멸).
let graphPin = null;
try{ graphPin = JSON.parse(sessionStorage.getItem("mm_graph_pin")||"null"); }
catch(e){ graphPin = null; }
function saveGraphPin(){
  try{
    if(graphPin) sessionStorage.setItem("mm_graph_pin", JSON.stringify(graphPin));
    else sessionStorage.removeItem("mm_graph_pin");
  }catch(e){}
}
// 현재 마우스가 올라가 있는 노드 {kind,key}(임시, 저장 안 함). 재렌더(5초 폴링)로 SVG·표가
// 새로 그려지면 mouseleave 없이 노드가 떨어져 나가 하이라이트가 사라지므로, pin 복원과
// 똑같이 재렌더 후 hover 도 다시 적용한다(pin 이 있으면 pin 우선 — hover 는 무시).
let graphHover = null;

// 필터 상태(검색어·status/net/eng·그룹/그래프 토글)도 pin 과 같은 이유로 sessionStorage 에
// 보관해 F5 후 복원한다(pin 만 살아남고 필터는 리셋되던 비대칭 제거). 탭 닫으면 소멸.
const FILTER_KEY = "mm_filters";
function saveFilters(){
  try{ sessionStorage.setItem(FILTER_KEY, JSON.stringify({
    q:$("#f-search").value, s:$("#f-status").value, n:$("#f-net").value,
    e:$("#f-eng").value, g:$("#f-group").checked, gr:$("#f-graph").checked })); }
  catch(e){}
}
function loadFilters(){
  let f=null; try{ f=JSON.parse(sessionStorage.getItem(FILTER_KEY)||"null"); }catch(e){}
  if(!f) return;
  $("#f-search").value = f.q||"";
  if(f.s!=null) $("#f-status").value = f.s;
  if(f.n!=null) $("#f-net").value = f.n;
  if(f.e!=null) $("#f-eng").value = f.e;
  if(f.g!=null) $("#f-group").checked = !!f.g;
  if(f.gr!=null) $("#f-graph").checked = !!f.gr;
}

// 서버 스냅샷 갱신 멈춤(stale) 감지: 폴링(fetch)이 성공해도 서버측 Refresher 가 멈추면
// 낡은 데이터가 초록불로 계속 표시된다. 서버가 찍은 ts 값이 "바뀌는지"만 보므로
// (클라이언트 시계와 직접 비교·파싱하지 않음) 서버-브라우저 시계차와 무관하게 동작한다.
let staleTs = null, staleSince = 0;   // ts 가 마지막으로 바뀐 시각(클라이언트 ms)
let snapStale = false;                // 최근 render 가 판정한 stale 여부 — tick 이 dot 색에 반영
function staleMs(snap){
  if(window.__SNAPSHOT__ || !snap.ts) return 0;   // 정지 페이지는 판단 안 함
  if(staleTs !== snap.ts){ staleTs = snap.ts; staleSince = Date.now(); }
  return Date.now() - staleSince;
}
function fmtAgo(ms){ const s=Math.round(ms/1000);
  return s<60 ? s+"초" : Math.floor(s/60)+"분 "+(s%60)+"초"; }

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function fmtNum(n){
  if(n==null || isNaN(Number(n))) return String(n);
  return (Math.round(Number(n)*100)/100).toLocaleString();
}
function uvKey(){ return (sessionStorage.getItem(UV_KEY)||"").trim(); }
// 키 필수 모드: 키가 저장돼 있으면 키로 조회한다(있으면 active).
function uvActive(){ return USER_VIEW && !!uvKey(); }
function setUvStatus(msg, cls){ const el=$("#uv-status");
  if(el){ el.textContent=msg||""; el.className="uv-status "+(cls||""); } }

// 그래프 컬럼 숨김 + 이전 SVG/리스너 정리 — render(그래프 OFF)와 키 클리어/검증 실패
// 화면 비우기에서 공통으로 쓴다(표만 지우고 그래프가 남는 잔상 방지).
function hideGraph(){
  const split=$("#topo-split"), gcol=$("#graph-col"), gwrap=$("#graphwrap");
  if(gcol) gcol.style.display="none";   // 그래프 숨김 → 표가 전체 폭
  if(split) split.classList.add("no-graph");
  if(gwrap) gwrap.innerHTML="";
}

// export 버튼 3개(admin JSON/정지 페이지 + 내 뷰 JSON) 일괄 숨김 — 키 지우기/검증
// 실패 화면에서 직전 뷰의 버튼이 남아 죽은 버튼(클릭 no-op)이 되는 것 방지.
function hideExports(){
  ["#exp-json","#exp-html","#exp-user-json"].forEach(sel=>{
    const el=$(sel); if(el) el.style.display="none"; });
}

// 키 필수 모드 초기/클리어 상태: 목록 대신 "키 입력" 안내만 보인다(폴링·노출 없음).
function showNeedKey(){
  lastSnap = null;
  $("#banner").innerHTML = '<div class="note-banner">🔑 키를 입력하면 '
    + '내 모델 목록이 보입니다. (admin 키를 넣으면 전체 뷰)</div>';
  $("#cards").innerHTML = "";
  $("#f-count").textContent = "";
  updatePinBadge(false,"");   // 표를 비우는 화면 — pin 칩도 잔류 금지
  const dt=$("#deployments");
  dt.querySelector("thead").innerHTML="";
  dt.querySelector("tbody").innerHTML='<tr><td class="empty">키 입력 대기 중</td></tr>';
  $("#dep-err").innerHTML = "";
  hideGraph();   // 직전 뷰(특히 admin 전체 뷰)의 라우팅 그래프가 남지 않게
  hideExports(); // 직전 뷰의 export/내 뷰 JSON 버튼도 잔류 금지
  const gt=$("#groups");
  gt.querySelector("thead").innerHTML="";
  gt.querySelector("tbody").innerHTML='<tr><td class="empty">—</td></tr>';
  const gc=$("#groups-count"); if(gc) gc.textContent="0";
  setUvStatus("", "");
}

// export 는 admin 키일 때만. 링크 클릭을 가로채 헤더에 키를 실어 fetch -> blob 다운로드/열기.
function exportWithKey(path, open){
  const key=uvKey(); if(!key) return;
  fetch(BASE_PATH+path,{headers:{"X-LiteLLM-Key":key},cache:"no-store"}).then(r=>{
    if(!r.ok){ setUvStatus("export 는 admin 키가 필요합니다","bad"); return null; }
    return r.blob();
  }).then(b=>{
    if(!b) return;
    const u=URL.createObjectURL(b);
    if(open){ window.open(u,"_blank"); }
    else { const a=document.createElement("a"); a.href=u;
           a.download="model-monitor-snapshot.json"; document.body.appendChild(a);
           a.click(); a.remove(); }
    setTimeout(()=>URL.revokeObjectURL(u), 15000);
  }).catch(()=>setUvStatus("export 실패","bad"));
}

function backendCell(d){
  const r=d.backends_ready, des=d.backends_desired, src=d.backend_source||"none";
  const errTip = d.k8s_error ? ' title="'+esc(d.k8s_error)+'"' : '';
  if(src==="external") return '<span class="srccol">external</span>';
  if(d.scale_to_zero) return '<div class="bk zero"><span class="num">0</span>'
    +'<span class="note">scaled-to-zero</span></div>';
  if(r==null){
    // 수집 실패 -> ? 에 마우스 올리면 원인(k8s_error) 표시
    return '<span class="srccol"'+errTip+'>?'+(d.k8s_error?' ⚠':'')+'</span>';
  }
  let cls="good";
  if(r===0) cls="bad"; else if(des!=null && r<des) cls="warn";
  const num = des!=null ? (r+"/"+des) : (""+r);
  let pct = des && des>0 ? Math.min(100, Math.round(r/des*100)) : (r>0?100:0);
  return '<div class="bk '+cls+'"><span class="num">'+num+'</span>'
    +'<span class="bar"><i style="width:'+pct+'%"></i></span></div>';
}

// DOWN 사유(down_reason) 사람이 읽는 라벨. 서버가 /health error 원문을 소수
// 카테고리로 정규화해 준다 — 여기선 그 카테고리에 한국어 설명을 붙인다(미매핑은
// 코드 그대로 노출).
const DOWN_REASON_TIP = {
  connection:     "백엔드에 연결 실패 (Pod/DNS 소멸·미기동 정황)",
  timeout:        "응답 타임아웃",
  rate_limit:     "레이트 리밋 (429)",
  auth:           "인증 실패 (키/권한)",
  not_found:      "대상 없음 (404·healthy endpoint 없음)",
  context_window: "컨텍스트 길이 초과",
  server_error:   "백엔드 5xx 서버 오류",
  client_error:   "요청 4xx 오류",
  no_ready_pods:  "ready Pod 0 (k8s readiness)",
  other:          "기타 오류",
};
// status_source 툴팁: 같은 UP 이라도 실제 /health 체크 결과인지, k8s readiness 추정인지
// 신뢰도가 다르다 — pill 에 마우스를 올리면 판정 근거를 보여준다.
const STATUS_SRC_TIP = {
  health:  "LiteLLM /health 체크 결과",
  k8s:     "k8s backend readiness 로 추정 (/health 미조회)",
  blocked: "LiteLLM 에서 관리자가 일시중지(pause)한 상태 — 장애가 아니라 "
           + "트래픽을 받지 않도록 꺼둔 것입니다",
  unknown: "판단 불가 — /health 미조회 + backend 확인 실패",
};
// DOWN pill 툴팁: 사유 라벨 + 서버가 준 error 첫 줄(status_detail). 운영자가 pill 에
// 마우스만 올리면 '왜 DOWN 인지'를 raw JSON 없이 바로 읽는다.
function downTip(d){
  if(!d) return "";
  const parts = [];
  if(d.down_reason) parts.push("사유: "+(DOWN_REASON_TIP[d.down_reason]||d.down_reason));
  if(d.status_detail) parts.push(d.status_detail);
  return parts.join("\n");
}
// 부하 값의 나이. 주기가 60초라 "지금"이 아니다 — 언제 읽은 값인지 항상 같이 보여준다.
function renderLoadAge(snap){
  const btn=$("#load-refresh"), lbl=$("#load-age");
  if(!btn||!lbl) return;
  // 즉시 갱신은 백엔드 팬아웃을 유발해 admin 전용이다(서버가 403). 비-admin 키에
  // 버튼만 보이면 눌러도 실패하는 UI 가 되므로 아예 숨긴다. 나이 표시는 남긴다.
  const on = !!snap.load_enabled && !snap.demo;
  const mayRefresh = on && (!snap.user_view || !!snap.admin_view);
  btn.hidden = !mayRefresh; lbl.hidden = !on;
  if(!on) return;
  const ts = snap.load_ts_epoch;
  if(ts==null){ lbl.textContent="부하 수집 대기"; lbl.classList.remove("stale"); return; }
  const age = Math.max(0, Math.round(Date.now()/1000 - ts));
  lbl.textContent = age<60 ? (age+"초 전") : (Math.floor(age/60)+"분 "+(age%60)+"초 전");
  // 주기(기본 60s)의 2배를 넘으면 수집이 밀리는 중 -> 눈에 띄게.
  lbl.classList.toggle("stale", age > 2*(snap.load_interval||60));
  lbl.title = "부하를 마지막으로 읽은 시각 기준. 주기 "
    + (snap.load_interval||60) + "초 · 버튼으로 즉시 갱신";
}

async function refreshLoadNow(){
  const btn=$("#load-refresh"), lbl=$("#load-age");
  if(!btn || btn.disabled) return;
  btn.disabled = true; const prev=btn.textContent; btn.textContent="⟳ 조회 중…";
  try{
    const key = (typeof uvKey==="function") ? uvKey() : "";
    const r = await fetch(BASE_PATH+"/api/load/refresh",
      {method:"POST", cache:"no-store",
       headers: key ? {"X-LiteLLM-Key": key} : {}});
    const j = await r.json().catch(()=>({}));
    if(!j.ok && lbl){
      lbl.textContent = j.retry_after ? (Math.ceil(j.retry_after)+"초 뒤 가능")
                                      : (j.error||"실패");
      lbl.classList.add("stale");
    }
    await tick();          // 갱신된 스냅샷을 바로 가져와 다시 그린다
  }catch(e){ if(lbl){ lbl.textContent="새로고침 실패"; lbl.classList.add("stale"); } }
  finally{ btn.textContent=prev;
    // 서버 최소 간격(10s)과 맞춰 연타를 막는다.
    setTimeout(()=>{ btn.disabled=false; }, 10000); }
}

function statusPill(s, d){
  const cls = statusPillCls(s);
  // PAUSED 는 'PAUSED(UP)' 처럼 원래 health 판정을 괄호로 덧붙인다 — 다시 켰을 때
  // 실제로 뜰 백엔드인지(Pod 가 살아있는지)를 한눈에 보게.
  let txt = s;
  if(s==="PAUSED"){
    const hs = d && d.health_status;
    txt = "PAUSED" + (hs && hs!=="?" ? "("+hs+")" : "");
  }
  // 판정 근거(status_source) + DOWN 사유를 한 툴팁에 합친다 — 같은 UP 이라도
  // /health 실측인지 k8s 추정인지 신뢰도가 다르고, DOWN 이면 원인이 바로 필요하다.
  const parts = [];
  const srcTip = d ? STATUS_SRC_TIP[d.status_source] : null;
  if(srcTip) parts.push("판정: "+srcTip);
  // PAUSED 는 status_source 가 "blocked" 로 덮여 괄호 안 값(원래 health 판정)의
  // 근거가 위 줄에서 사라진다. 실측인지 추정인지는 "다시 켜면 뜰까" 를 판단하는
  // 신뢰도라 반드시 따로 보여준다 — MONITOR_HEALTH 기본 off 에서는 추정이 흔하다.
  if(s==="PAUSED" && d && d.health_status && d.health_status_source){
    const hsTip = STATUS_SRC_TIP[d.health_status_source];
    if(hsTip) parts.push("괄호 안 "+d.health_status+" 의 근거: "+hsTip);
  }
  // 사유는 DOWN 일 때, 그리고 일시중지됐지만 원래 health 가 DOWN 이었을 때도 보여준다
  // — 다시 켜도 뜨지 않을 백엔드인지 미리 알아야 하기 때문.
  const dtip = (s==="DOWN" || (s==="PAUSED" && d && d.health_status==="DOWN"))
    ? downTip(d) : "";
  if(dtip) parts.push(dtip);
  const tip = parts.join("\n");
  const mark = dtip ? " ⚠" : "";
  return '<span class="pill '+cls+'"'+(tip?' title="'+esc(tip)+'"':'')+'>'
    +esc(txt)+mark+'</span>';
}

function card(label,val,cls,sub){
  return '<div class="card"><div class="label">'+esc(label)+'</div>'
    +'<div class="val '+(cls||"")+'">'+val+'</div>'
    +(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
}

// ── TYPE 2축 헬퍼: 네트워크(kserve/service/external)와 엔진(vllm/sglang) ──
// 구버전 스냅샷(network_type/backend_type 없음)은 레거시 type 에서 최대한 유도.
function netOf(d){
  if(d.network_type) return d.network_type;
  // 구버전/backend_count 미동작 폴백: backend_source 의 external 은 신뢰 가능
  if(d.backend_source==="external") return "external";
  return d.type==="kserve" ? "kserve" : "-";
}
function engOf(d){
  if(d.backend_type) return d.backend_type;
  const t=d.type; return (t==="vllm"||t==="sglang") ? t : "-";
}
function typeChips(net, eng){
  let h="";
  if(net && net!=="-") h+='<span class="chip '+(net==="mixed"?"mixed":"net")+'">'+esc(net)+'</span>';
  if(eng && eng!=="-") h+='<span class="chip '+(eng==="mixed"?"mixed":"eng")+'">'+esc(eng)+'</span>';
  return h || '<span class="chip">-</span>';
}
// 그룹의 자식들이 서로 다른 값이면 "mixed" 로 표기(첫 자식 값으로 뭉개지 않음)
function uniqOr(vals, mixed){ const s=new Set(vals); return s.size===1?vals[0]:mixed; }

// ── 모델 기준 그룹 뷰 헬퍼 ──────────────────────────────────────────────
// 같은 백엔드(Service)를 여러 model_name 이 공유할 수 있으므로 (ns,svc) 로 식별.
// per-user 뷰는 ns/svc 가 리댁션되지만 익명 backend_ref 로 같은 토폴로지를 유지한다.
function svcKeyOf(d){
  if(d.namespace || d.service) return (d.namespace||"")+"/"+(d.service||"");
  if(d.backend_ref) return "ref:"+d.backend_ref;
  return "api:"+(d.api_base||"external");
}
// 백엔드 표시 라벨: Service 이름 → api_base 호스트 → 익명 ref → external 순 폴백
function svcLabelOf(d){
  return d.service || backendHost(d.api_base)
    || (d.backend_ref ? "backend·"+d.backend_ref : "external");
}
function trunc(s,n){s=String(s==null?"":s);return s.length>n?s.slice(0,n-1)+"…":s;}
function backendHost(api){ if(!api) return "";
  return String(api).replace(/^[a-z]+:\/\//,"").replace(/[:\/].*$/,""); }
function compositeStatus(bes){
  // 일시중지된 backend 는 라우팅 풀에서 빠져 있으니 그룹 가용성 판정에서 뺀다
  // (LiteLLM 도 blocked sibling 을 건너뛰고 남은 deployment 로 라우팅한다).
  // 전부 일시중지면 그 모델 이름은 통째로 트래픽을 못 받는다 -> PAUSED.
  const live = bes.filter(b=>(b.status||"?")!=="PAUSED");
  if(live.length===0) return bes.length ? "PAUSED" : "?";
  let up=0,down=0;
  live.forEach(b=>{const s=b.status||"?"; if(s==="UP")up++; else if(s==="DOWN")down++;});
  if(up===live.length) return "UP";
  if(down===live.length && down>0) return "DOWN";
  if(up>0) return "DEGRADED";
  return "?";
}
function statusPillCls(s){return s==="UP"?"up":(s==="DOWN"?"down":
  (s==="DEGRADED"?"deg":(s==="PAUSED"?"pause":"unk")));}
// 그룹 헤더의 합성 pill: 무엇으로 합성됐는지(UP/DOWN/?/일시중지 내역) 툴팁으로 풀어준다.
// compositeStatus 가 일시중지 backend 를 가용성 판정에서 제외하므로 내역에도 따로
// 세어 보여준다 — 안 그러면 'UP 1' 뒤에 꺼둔 sibling 2개가 조용히 묻힌다.
function compositePill(s, bes){
  let tip="";
  if(bes && bes.length){ let up=0,down=0,paused=0,unk=0;
    bes.forEach(b=>{const t=b.status||"?";
      if(t==="UP")up++; else if(t==="DOWN")down++; else if(t==="PAUSED")paused++; else unk++;});
    tip = bes.length+"개 backend 합성: UP "+up+" · DOWN "+down
        +(paused?" · 일시중지 "+paused:"")+(unk?" · ? "+unk:"");
  }
  return '<span class="pill '+statusPillCls(s)+'"'+(tip?' title="'+esc(tip)+'"':'')+'>'+esc(s)+'</span>';
}
function sumBackends(bes){
  let r=null,d=null;
  bes.forEach(b=>{ if(b.backends_ready!=null) r=(r||0)+b.backends_ready;
    if(b.backends_desired!=null) d=(d||0)+b.backends_desired; });
  return {r:r,d:d};
}
function aggCell(r,d){
  if(r==null) return '<span class="srccol">?</span>';
  let cls="good"; if(r===0) cls="bad"; else if(d!=null && r<d) cls="warn";
  const num = d!=null?(r+"/"+d):(""+r);
  const pct = d&&d>0?Math.min(100,Math.round(r/d*100)):(r>0?100:0);
  return '<div class="bk '+cls+'"><span class="num">Σ '+num+'</span>'
    +'<span class="bar"><i style="width:'+pct+'%"></i></span></div>';
}
function sharedMap(all){
  const mp={};
  (all||[]).forEach(d=>{const k=svcKeyOf(d);(mp[k]=mp[k]||new Set()).add(d.model_name);});
  return mp;
}
// backend Service 별 '전부 일시중지인가'. sharedMap 과 마찬가지로 **필터 전**
// 전체 목록으로 계산해야 한다 — 필터로 살아있는 sibling 이 화면에서 빠졌을 뿐인데
// 물리 백엔드를 꺼진 것으로 칠하면 거짓말이 된다(status='PAUSED' 필터가 정확히
// 그 상황을 만든다).
function pausedMap(all){
  const mp={};
  (all||[]).forEach(d=>{const k=svcKeyOf(d);
    mp[k]=(mp[k]===undefined?true:mp[k]) && d.status==="PAUSED";});
  return mp;
}
// 장치명 -> 색(고정 매핑 + 해시 폴백). 상태색(green/red)과 겹치지 않는 계열.
const DEV_COLORS={H100:"#b083f0",B200:"#56d4dd",A100:"#6e8bff",L40S:"#d29922",H200:"#f0883e"};
const DEV_POOL=["#b083f0","#56d4dd","#6e8bff","#d29922","#3fb950","#f0883e"];
function devColor(n){ if(DEV_COLORS[n]) return DEV_COLORS[n];
  let h=0; for(const ch of String(n)) h=(h*31+ch.charCodeAt(0))>>>0; return DEV_POOL[h%DEV_POOL.length]; }
// 혼합 GPU: 장치별 색 칩. lead 가 있으면 앞에 총합/Σ 표시.
function gpuChips(products, lead){
  const keys=Object.keys(products||{}).sort();
  const chips=keys.map(k=>{const col=devColor(k);
    return '<span class="gchip" style="color:'+col+';border-color:'+col+'66;background:'+col+'1a">'
      +'<i class="dot" style="background:'+col+'"></i>'+esc(k)+'×'+products[k]+'</span>';}).join("");
  return '<span class="gchips">'+(lead?'<span class="gtot">'+esc(lead)+'</span>':'')+chips+'</span>';
}
// 그래프 노드용 축약 텍스트
function gpuText(g, products){
  if(g==null) return "?"; if(g===0) return "-";
  const ps=products||{}, keys=Object.keys(ps).sort();
  if(keys.length===1) return keys[0]+"×"+ps[keys[0]];
  return keys.map(k=>k+"×"+ps[k]).join("·");
}
function gpuCell(d){
  const g=d.gpu_ready;
  if(g==null) return '<span class="srccol"'+(d.gpu_error?' title="'+esc(d.gpu_error)+'"':'')+'>?'+(d.gpu_error?' ⚠':'')+'</span>';
  if(g===0) return '<span class="srccol">-</span>';

  return gpuChips(d.gpu_products, keys.length>1?String(g):"");   // 혼합이면 총합 표시
}
function sumGpu(bes){
  let total=null; const products={};
  bes.forEach(b=>{ if(b.gpu_ready!=null){ total=(total||0)+b.gpu_ready;
    const ps=b.gpu_products||{}; for(const k in ps) products[k]=(products[k]||0)+ps[k]; } });
  return {g:total, products:products};
}
function aggGpuCell(g, products){
  if(g==null) return '<span class="srccol">?</span>';
  if(g===0) return '<span class="srccol">-</span>';
  const keys=Object.keys(products||{});
  return gpuChips(products, keys.length>1?("Σ "+g):"Σ");
}
// 헤드라인 GPU 카드: 장치 비율 세그먼트 바 + 범례
function gpuBar(products){
  const keys=Object.keys(products||{}).sort();
  const t=keys.reduce((a,k)=>a+products[k],0)||1;
  const segs=keys.map(k=>'<i style="width:'+(products[k]/t*100)+'%;background:'+devColor(k)
    +'" title="'+esc(k)+'×'+products[k]+'"></i>').join("");
  const leg=keys.map(k=>'<span><i style="background:'+devColor(k)+'"></i>'+esc(k)+'×'+products[k]+'</span>').join("");
  return '<span class="gbar">'+segs+'</span><span class="glegend">'+leg+'</span>';
}
// ── 지금 부하 (백엔드 엔진 게이지) ───────────────────────────────────────
// per-user 뷰는 리댁션 때문에 평탄한 스칼라(load_state/load_running/...)만 온다.
// 셀/집계가 두 형태를 따로 다루지 않도록 여기서 admin 뷰와 같은 모양으로 되돌린다.
const LOAD_CODE_TEXT = {timeout:"응답 없음(타임아웃)", refused:"연결 안 됨",
  forbidden:"권한 없음", no_metrics:"게이지 없음",
  skipped_wake_risk:"조회 안 함(깨울 위험)", skipped_external:"조회 안 함(외부 백엔드)",
  no_sample:"표본 없음", error:"수집 실패"};
function loadOf(d){
  if(d.load) return d.load;
  if(d.load_state==null) return null;
  return {state:d.load_state,
          state_reason:d.load_reason||LOAD_CODE_TEXT[d.load_reason_code]||"",
          running:d.load_running, waiting:d.load_waiting, kv_cache_pct:d.load_kv_pct,
          pods_sampled:d.load_pods_sampled||0, pods_failed:d.load_pods_failed||0,
          // summary 모드는 표본 수 대신 불리언만 온다(수치 비노출).
          partial:!!d.load_partial,
          scope:d.load_scope, per_pod:[]};
}
const LOAD_LV = {saturated:["FULL","full"], busy:["BUSY","busy"],
                 ok:["ok","ok"], idle:["idle","idle"], unknown:["?","unk"]};
const LOAD_RANK = {saturated:3, busy:2, ok:1, idle:0, unknown:-1};

// 실패 사유는 길다 -> 셀에는 짧게, 원문은 툴팁으로. 타임아웃과 연결 거부를
// 구분한다: 타임아웃은 "엔진이 너무 바빠 /metrics 도 못 돌려주는 중"일 수 있어
// 죽었거나 막힌 것과 뜻이 다르다.
function loadWhyShort(reason){
  const r=String(reason||"").toLowerCase();
  if(r.includes("timed out")||r.includes("timeout")) return "응답 없음(타임아웃)";
  if(r.includes("connection")||r.includes("refused")) return "연결 안 됨";
  if(r.includes("게이지")||r.includes("metric")) return "게이지 없음";
  if(r.includes("생략")||r.includes("external")) return "조회 안 함";
  return String(reason||"").slice(0,28);
}
// 표본 출처 툴팁. per-user 뷰(uHide)에서는 Pod 주소를 노출하지 않는다.
function podTip(l, uHide){
  if(!l) return "";
  const scope = l.scope==="pods" ? ("Pod "+(l.pods_sampled||0)+"개 직접 조회")
    : l.scope==="prometheus" ? ("Prometheus 경유 — Pod "+(l.pods_sampled||0)+"개 (스크레이프 주기만큼 지연)")
    : l.scope==="skipped" ? "조회하지 않음 — "+(l.error||"")
    : "LB 경유 1개 샘플 (Pod 주소 미확인)";
  if(uHide) return scope;
  const rows=(l.per_pod||[]).map(p=> p.error ? ((p.url||"")+" — "+p.error)
    : ((p.url||"")+" — run "+(p.running!=null?p.running:"?")
       +", queue "+(p.waiting!=null?p.waiting:"?")
       +", kv "+(p.kv_cache_pct!=null?p.kv_cache_pct+"%":"?")));
  return scope + (rows.length? ("\n"+rows.join("\n")) : "");
}
// 일부 Pod 만 응답했으면 그 사실을 등급 옆에 적는다 — 숫자의 근거를 숨기지 않는다.
function partialNote(l){
  const bad=(l||{}).pods_failed||0;
  // 표본 수를 안 주는 모드(per-user summary)에서도 "일부만 보고 낸 등급"이라는
  // 사실은 숨기지 않는다 — 불완전한 값을 완전한 척 보여주지 않는 것이 우선이다.
  if(!bad) return (l||{}).partial ? " (일부 Pod)" : "";
  const ok=l.pods_sampled||0;
  return " ("+ok+"/"+(ok+bad)+" Pod)";
}
// 처리 중/대기 숫자 조각. 대기가 있으면 노랑(>=5 빨강)으로 드러낸다.
function inflightBit(l){
  if(!l || (l.running==null && l.waiting==null)) return "";
  const run = l.running!=null ? l.running : "?";
  const q = l.waiting;
  const qs = q ? '<b style="color:'+(q>=5?"var(--down)":"var(--warn)")+'">+'+q+'</b>' : "";
  return '<span class="lnum" title="처리 중 '+run+' · 대기 '+(q!=null?q:"?")+'">'
    +run+qs+'</span>';
}
// KV 사용률 조각(작은 막대 + %).
function kvBit(l){
  if(!l || l.kv_cache_pct==null) return "";
  const pct=Math.min(100,Math.round(l.kv_cache_pct));
  const tip = l.kv_cache_avg_pct!=null
    ? ("KV 최대 "+l.kv_cache_pct+"% · 평균 "+l.kv_cache_avg_pct+"%") : "KV 캐시 사용률";
  return '<span class="kv '+kvClass(pct)+'" title="'+esc(tip)+'">'
    +'<span class="kvbar"><i style="width:'+pct+'%"></i></span><b>'+pct+'%</b></span>';
}
function loadCell(d, uHide){
  const l=loadOf(d);
  if(!l) return '<span class="srccol">-</span>';
  const st=l.state||"unknown", lv=LOAD_LV[st]||LOAD_LV.unknown;
  const why = st==="unknown" ? loadWhyShort(l.state_reason)
                             : (l.state_reason||"")+partialNote(l);
  const tip = (st==="unknown"&&l.state_reason ? l.state_reason+"\n" : "")+podTip(l,uHide);
  return '<div class="load" title="'+esc(tip)+'"><span class="lv '+lv[1]+'">'+lv[0]+'</span>'
    +'<span class="why">'+esc(why)+'</span>'+inflightBit(l)+kvBit(l)+'</div>';
}
// 처리 중 + 대기를 한 셀에 (표 폭이 귀하다 — 그래프와 좌우 분할).
// tok/s 는 이 셀 툴팁으로 내린다: 있으면 좋지만 "바쁜가"의 1차 신호는 아니다.
function kvClass(pct){ return pct>=95?"bad":(pct>=80?"warn":"good"); }
// --- 그룹(모델) 단위 롤업 -------------------------------------------------
// 모델 등급 = backend 중 **가장 나쁜 것**. LiteLLM 기본 라우팅(simple-shuffle)은
// 여유 있는 backend 로만 보내주지 않으므로, 하나가 포화면 요청 일부는 기다린다.
// 대신 등급 분포(FULL 1 · ok 2)를 함께 보여 과잉 경보가 되지 않게 한다.
// 모델 등급 = 라우팅 방식에 달렸다. least-busy(기본)면 다음 요청이 갈 **가장
// 한가한** backend 가 답이고, simple-shuffle 이면 포화된 backend 도 트래픽을 받으니
// **가장 나쁜** 쪽이 정직하다. summarize 와 같은 규칙을 써야 카드와 표가 안 어긋난다.
function compositeLoad(bes, leastBusy){
  let pick=null, counts={};
  bes.forEach(b=>{ const l=loadOf(b); if(!l) return;
    const st=l.state||"unknown"; counts[st]=(counts[st]||0)+1;
    const r=LOAD_RANK[st]??-1;
    if(r<0) return;                       // 모름은 등급 후보가 아니다
    const cur=pick?(LOAD_RANK[pick.state]??-1):null;
    if(cur===null || (leastBusy ? r<cur : r>cur)) pick={state:st, load:l};
  });
  if(!pick){   // 전부 모름 -> 그 사실을 그대로
    const any=bes.map(loadOf).find(Boolean);
    if(any) pick={state:"unknown", load:any};
  }
  return {worst:pick, counts:counts};
}
function compositeLoadCell(bes, uHide, leastBusy){
  const c=compositeLoad(bes, leastBusy);
  if(!c.worst) return '<span class="srccol">-</span>';
  const st=c.worst.state, lv=LOAD_LV[st]||LOAD_LV.unknown;
  const order=["saturated","busy","ok","idle","unknown"];
  const spread=order.filter(k=>c.counts[k]).map(k=>(LOAD_LV[k]||LOAD_LV.unknown)[0]+" "+c.counts[k]);
  const n=bes.filter(b=>b.load).length;
  const why = n>1 ? spread.join(" · ")
    : (st==="unknown" ? loadWhyShort(c.worst.load.state_reason)
                      : (c.worst.load.state_reason||"")+partialNote(c.worst.load));
  const tip = n>1
    ? (leastBusy
       ? ("backend "+n+"개 중 **가장 한가한** 등급으로 표시 — least-busy 라우팅이면 "
          +"다음 요청은 여유 있는 backend 로 간다. 분포로 부분 포화를 함께 표시.")
       : ("backend "+n+"개 중 **가장 나쁜** 등급으로 표시 — simple-shuffle 라우팅이면 "
          +"포화된 backend 도 요청 일부를 받는다."))
    : podTip(c.worst.load, uHide);
  const sl=sumLoad(bes).load;
  return '<div class="load" title="'+esc(tip)+'"><span class="lv '+lv[1]+'">'+lv[0]+'</span>'
    +'<span class="why">'+esc(why)+'</span>'+inflightBit(sl)+kvBit(sl)+'</div>';
}
// 요청 수는 합, 사용률은 최댓값(더하는 값이 아니다).
function sumLoad(bes){
  let run=null,q=null,kv=null,tp=null;
  bes.forEach(b=>{ const l=loadOf(b); if(!l) return;
    if(l.running!=null) run=(run||0)+l.running;
    if(l.waiting!=null) q=(q||0)+l.waiting;
    if(l.kv_cache_pct!=null) kv=(kv==null?l.kv_cache_pct:Math.max(kv,l.kv_cache_pct));
    if(l.throughput!=null) tp=(tp||0)+l.throughput; });
  return {load:{running:run, waiting:q, kv_cache_pct:kv, throughput:tp}};
}

// model_name 으로 묶은 tbody 행들(부모 그룹 행 + 자식 백엔드 행)
function groupedRows(merged, shared, showBk, showGpu, showLoad, uHide,
                    leastBusy){
  const order=[], groups={};
  merged.forEach(d=>{ if(!groups[d.model_name]){groups[d.model_name]=[];order.push(d.model_name);}
    groups[d.model_name].push(d); });
  return order.map(name=>{
    const bes=groups[name];
    const st=compositeStatus(bes), agg=sumBackends(bes);
    const net=uniqOr(bes.map(netOf),"mixed"), eng=uniqOr(bes.map(engOf),"mixed");
    // data-svcs: 이 그룹이 품은 backend 들의 키(공백 구분) — backend 노드 호버 시 자식행뿐
    // 아니라 부모 그룹행도 함께 하이라이트되게(model 노드 호버가 부모+자식을 밝히는 것과 대칭).
    const svcs=bes.map(b=>attrId(svcKeyOf(b))).join(" ");
    let html='<tr class="grp-row" data-model="'+attrId(name)+'" data-svcs="'+svcs+'"><td>'+compositePill(st,bes)+'</td>'
      +'<td class="name">'+esc(name)
        +'<span class="nbk">'+bes.length+' backend'+(bes.length>1?'s':'')+'</span></td>'
      + (showLoad ? '<td>'+compositeLoadCell(bes,uHide,leastBusy)+'</td>' : '')
      +'<td>'+typeChips(net,eng)+'</td>';
    if(showBk){ html+='<td>'+aggCell(agg.r,agg.d)+'</td>';
      if(showGpu){const sg=sumGpu(bes); html+='<td>'+aggGpuCell(sg.g,sg.products)+'</td>';}
      html+='<td></td><td></td>'; }
    html+='<td></td></tr>';
    bes.forEach(b=>{
      const k=svcKeyOf(b), sh=shared[k]&&shared[k].size>1;
      const others=sh?[...shared[k]].filter(x=>x!==name):[];
      const svcLabel=svcLabelOf(b);
      html+='<tr class="child-row" data-model="'+attrId(name)+'" data-svc="'+attrId(k)+'"><td>'+statusPill(b.status||"?",b)+'</td>'
        +'<td class="leg"><span class="svc">'+esc(svcLabel)+'</span>'
          +(sh?'<span class="shared">⇄ '+esc(others.join(", "))+'</span>':'')+'</td>'
        + (showLoad ? '<td>'+loadCell(b,uHide)+'</td>' : '') + '<td></td>';
      if(showBk){ html+='<td>'+backendCell(b)+'</td>';
        if(showGpu) html+='<td>'+gpuCell(b)+'</td>';
        html+='<td class="mono" style="font-size:12px;color:var(--muted)">'+esc(b.mode||"-")+'</td>'
          +'<td class="srccol">'+esc(b.backend_source||"-")+'</td>'; }
      html+='<td class="api" title="'+esc(b.api_base)+'\n(클릭하여 복사)">'+esc(b.api_base||"-")+'</td></tr>';
    });
    return html;
  }).join("");
}

// ── Model ↔ Backend 이분 그래프 (SVG, 외부 의존성 0) ─────────────────────
function beNodeCls(o){
  // 일시중지가 최우선 — Pod 가 살아 있어도(r>0) 라우팅에서 빠져 있으므로
  // 초록(정상)으로 칠하면 안 된다.
  if(o.paused) return "paused";
  if(o.ext) return "unk";
  if(o.stz) return "zero";
  if(o.r==null) return "unk";
  if(o.r===0) return "down";
  if(o.des!=null && o.r<o.des) return "warn";
  return "up";
}
// data-key/data-model/data-svc 및 CSS 속성선택자에 안전하게 쓰는 노드 식별자.
// encodeURIComponent 는 단사(injective)라 서로 다른 이름이 같은 키로 뭉개지지 않고
// ('gpt.4' vs 'gpt_4' 등 pin/하이라이트가 엉뚱한 행에 걸리는 충돌 방지),
// 출력에 " 나 \ 가 없어 큰따옴표 속성값/선택자에 그대로 넣어도 안전하다.
function attrId(s){return encodeURIComponent(String(s));}
function buildGraph(deps, pausedBy){
  if(!deps || !deps.length) return "";
  const names=[], seenN={};
  deps.forEach(d=>{ if(!seenN[d.model_name]){seenN[d.model_name]=1;names.push(d.model_name);} });
  // 대소문자만 다른 이름('vllm-X'↔'vLLM-X')은 lower 비교가 0이라 동률 → 원문으로 결정적 고정
  names.sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()) || a.localeCompare(b));
  const svcOrder=[], svc={};
  deps.forEach(d=>{ const k=svcKeyOf(d);
    if(!svc[k]){ svc[k]={key:k,label:svcLabelOf(d),
      r:d.backends_ready,des:d.backends_desired,status:d.status,
      // 그 Service 를 가리키는 deployment 가 **전부** 일시중지일 때만 paused.
      // 판정은 필터 전 전체 목록(pausedMap)에서 온다 — 필터된 목록으로 접으면
      // 살아있는 sibling 이 화면에서 빠졌을 뿐인데 꺼진 것으로 칠하게 된다.
      paused:!!(pausedBy && pausedBy[k]),
      gpu:d.gpu_ready,gpu_products:d.gpu_products,
      ext:(d.backend_source==="external"),stz:d.scale_to_zero,models:new Set()}; svcOrder.push(k); }
    svc[k].models.add(d.model_name); });
  const NW=148, NH=34, GAP=12, PADX=14, PADY=28, W=520;
  const colL=PADX, colR=W-PADX-NW;
  const rows=Math.max(names.length, svcOrder.length);
  const H=PADY+rows*NH+(rows>0?(rows-1)*GAP:0)+18;
  const colY=(k,total)=>{const t=total*NH+(total-1)*GAP; const s=(H-PADY-18-t)/2+PADY; return s+k*(NH+GAP);};
  const mY={}, sY={};
  names.forEach((n,i)=>mY[n]=colY(i,names.length));
  svcOrder.forEach((k,i)=>sY[k]=colY(i,svcOrder.length));
  let edges="";
  deps.forEach(d=>{ const k=svcKeyOf(d), sh=svc[k].models.size>1;
    const y1=mY[d.model_name]+NH/2, y2=sY[k]+NH/2, x1=colL+NW, x2=colR, mx=(x1+x2)/2;
    edges+='<path class="gedge'+(sh?' shared':'')+'" data-m="'+attrId(d.model_name)+'" data-b="'+attrId(k)+'" '
      +'d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'"></path>'; });
  let mnodes="";
  names.forEach(n=>{ const y=mY[n];
    mnodes+='<g class="gnode model" data-key="'+attrId(n)+'" data-kind="m">'
      +'<title>'+esc(n)+'</title>'   // 잘린 이름(…) 전체를 네이티브 tooltip 으로
      +'<rect x="'+colL+'" y="'+y+'" width="'+NW+'" height="'+NH+'" rx="8"></rect>'
      +'<text class="ntext" x="'+(colL+11)+'" y="'+(y+14)+'">'+esc(trunc(n,18))+'</text>'
      +'<text class="nsub" x="'+(colL+11)+'" y="'+(y+26)+'">model_name</text></g>'; });
  let snodes="";
  svcOrder.forEach(k=>{ const o=svc[k], sh=o.models.size>1, y=sY[k];
    const gtxt=(o.gpu!=null && o.gpu>0)?("  ·  "+gpuText(o.gpu,o.gpu_products)):"";
    let sub=o.ext?"external":((o.r==null?"?":o.r+(o.des!=null?"/"+o.des:""))+" replicas"+gtxt+(sh?"  ·  shared ×"+o.models.size:""));
    if(o.paused) sub="일시중지  ·  "+sub;
    snodes+='<g class="gnode be '+beNodeCls(o)+(sh?' shared':'')+'" data-key="'+attrId(k)+'" data-kind="b">'
      +'<title>'+esc(o.label)+(sub?' — '+esc(sub):'')+'</title>'  // 전체 라벨+상태 tooltip
      +'<rect x="'+colR+'" y="'+y+'" width="'+NW+'" height="'+NH+'" rx="8"></rect>'
      +'<text class="ntext" x="'+(colR+11)+'" y="'+(y+14)+'">'+esc(trunc(o.label,18))+'</text>'
      +'<text class="nsub" x="'+(colR+11)+'" y="'+(y+26)+'">'+esc(sub)+'</text>'
      +(sh?'<text class="badge-shared" x="'+(colR+NW-7)+'" y="'+(y+13)+'" text-anchor="end">⇄</text>':'')
      +'</g>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Model 과 Backend 라우팅 그래프">'
    +'<text class="glabel" x="'+colL+'" y="20">Models</text>'
    +'<text class="glabel" x="'+colR+'" y="20">Backends (Service)</text>'
    +edges+mnodes+snodes+'</svg>';
}
// ── 그래프 ↔ Deployments 표 연동 ──────────────────────────────────────────
// 노드의 data-key(attrId) 와 행의 data-model / data-svc(attrId) 가 같은 규칙이라 그대로 매칭.
function depMatchesPin(d, pin){
  if(!pin) return true;
  return pin.kind==="m" ? attrId(d.model_name)===pin.key
                        : attrId(svcKeyOf(d))===pin.key;
}
// 노드 호버: 대응 행에 .hl 부여(그래프 focus 와 짝). 그룹 뷰에선 model 노드가 부모+자식,
// backend 노드가 그 backend 자식행(공유면 여러 모델의 자식)에 붙는다.
function highlightRows(kind, key){
  clearRowHighlight();
  // backend 노드는 자식행(data-svc)뿐 아니라 그 backend 를 품은 그룹행(data-svcs~=key)도 밝힘
  const sel = kind==="m" ? '[data-model="'+key+'"]'
                         : '[data-svc="'+key+'"],#deployments tbody tr[data-svcs~="'+key+'"]';
  document.querySelectorAll("#deployments tbody tr"+sel).forEach(tr=>tr.classList.add("hl"));
  // 강조 행이 표 스크롤 영역(.tablewrap) 밖이면 그 컨테이너만 스크롤해 보이게 한다.
  // scrollTop 을 직접 조정 → 페이지/그래프는 움직이지 않음. 이미 보이면 no-op(불필요한 흔들림 방지).
  const first=document.querySelector("#deployments tbody tr.hl"), wrap=first&&first.closest(".tablewrap");
  if(wrap){ const r=first.getBoundingClientRect(), w=wrap.getBoundingClientRect();
    if(r.top<w.top) wrap.scrollTop+=r.top-w.top-8;
    else if(r.bottom>w.bottom) wrap.scrollTop+=r.bottom-w.bottom+8; }
}
function clearRowHighlight(){
  document.querySelectorAll("#deployments tbody tr.hl").forEach(tr=>tr.classList.remove("hl"));
}
// 표 라벨의 📌 칩: pin 으로 목록을 좁혔음을 표시(비면 지움). 칩 클릭 해제는 아래 리스너.
function updatePinBadge(active, label){
  const pb=$("#pin-badge"); if(!pb) return;
  // 실제 <button> 이라 키보드(Tab→Enter/Space)로도 해제 가능. 클릭은 #dep-label 위임이 받음.
  pb.innerHTML = active
    ? '<button type="button" class="pinchip" aria-label="목록 좁힘 해제: '+esc(label)+'"'
      +' title="이 노드로 목록을 좁힘 — 클릭(또는 Esc)해 해제">📌 '+esc(trunc(label,22))+' <b>✕</b></button>'
    : "";
}
function wireGraph(svg){
  if(!svg) return;
  const edges=[...svg.querySelectorAll(".gedge")];
  const nodes=[...svg.querySelectorAll(".gnode")];
  edges.forEach(ed=>{ if(ed.dataset.d0==null) ed.dataset.d0=ed.getAttribute("d"); });
  const STEP=42;   // 모을 때 노드 간격(원래 행 간격 46 보다 좁게 → 한 덩어리로 보임)
  const rect=n=>n.querySelector("rect");
  const cy=n=>{const r=rect(n);return +r.getAttribute("y")+(+r.getAttribute("height"))/2;};
  const ax=(n,side)=>{const r=rect(n);
    return side==="r" ? +r.getAttribute("x")+(+r.getAttribute("width")) : +r.getAttribute("x");};
  const nodeOf=(k,key)=>svg.querySelector('.gnode[data-kind="'+k+'"][data-key="'+key+'"]');
  const reroute=(ed,mN,bN,my,by)=>{const x1=ax(mN,"r"),x2=ax(bN,"l"),mx=(x1+x2)/2;
    ed.setAttribute("d","M"+x1+" "+my+" C"+mx+" "+my+" "+mx+" "+by+" "+x2+" "+by);};
  let pinned=null;   // 클릭으로 고정된 노드(없으면 null) — hover 보다 우선

  const clear=()=>{svg.classList.remove("focusing");
    nodes.forEach(n=>{n.classList.remove("on","pinned");n.style.transform="";});
    edges.forEach(ed=>{ed.classList.remove("on");ed.setAttribute("d",ed.dataset.d0);});};

  // 한 노드에 포커스: 비연결 숨김 + 연결 노드 끌어모으기 + 간선 재배선. (먼저 clear 해서
  // hover↔hover, pin 전환이 항상 깨끗하게 다시 그려지도록 한다.)
  const apply=(node)=>{
    clear();
    const kind=node.dataset.kind, key=node.dataset.key;
    svg.classList.add("focusing"); node.classList.add("on");
    if(node===pinned) node.classList.add("pinned");
    const matched=edges.filter(ed=>kind==="m"?ed.dataset.m===key:ed.dataset.b===key);
    const others=[], oset=new Set();
    matched.forEach(ed=>{ed.classList.add("on");
      const o=nodeOf(kind==="m"?"b":"m", kind==="m"?ed.dataset.b:ed.dataset.m);
      if(o&&!oset.has(o)){oset.add(o);o.classList.add("on");others.push(o);}});
    const Hc=cy(node), n=others.length, half=(n-1)/2*STEP;
    const vbH=(svg.viewBox&&svg.viewBox.baseVal)?svg.viewBox.baseVal.height:0;
    let shift=0;
    if(vbH){ if(Hc-half<30) shift=30-(Hc-half);
      else if(Hc+half>vbH-26) shift=(vbH-26)-(Hc+half); }
    const ty=new Map();
    others.forEach((o,i)=>{const y=Hc+shift+(i-(n-1)/2)*STEP; ty.set(o,y);
      o.style.transform="translateY("+(y-cy(o))+"px)";});
    matched.forEach(ed=>{
      const o=nodeOf(kind==="m"?"b":"m", kind==="m"?ed.dataset.b:ed.dataset.m);
      if(!o) return;
      const oy=ty.has(o)?ty.get(o):cy(o);
      const mN=kind==="m"?node:o, bN=kind==="b"?node:o;
      reroute(ed, mN, bN, mN===node?Hc:oy, bN===node?Hc:oy);
    });
  };

  // hover = 임시 프리뷰, click = 고정(pin). 고정하면 그 배치가 그대로 얼어붙어,
  // 끌어모은 노드 위로 마우스를 올려 값(<title> tooltip)을 읽어도 배치가 흐트러지지 않는다.
  // (고정 중엔 hover 를 무시 — 예전엔 hover 가 포커스를 가로채 "풀리는" 것처럼 보였다.)
  // 다른 노드로 옮기려면 그 노드를 클릭(재고정), 빈 배경/고정 노드 재클릭으로 해제.
  // 클릭(pin)은 graphPin 만 갱신하고 render(lastSnap) 로 다시 그린다 — 표를 그 노드로
  // 좁히고(아래 render), 그래프 focus 는 재렌더 후 복원 로직이 다시 건다(5초 폴링과 동일 경로).
  const setPin=(p)=>{ graphPin=p; saveGraphPin(); if(typeof lastSnap!=="undefined"&&lastSnap) render(lastSnap); };
  nodes.forEach(node=>{
    node.addEventListener("mouseenter",()=>{ if(!pinned){
      graphHover={kind:node.dataset.kind,key:node.dataset.key};
      apply(node); highlightRows(node.dataset.kind,node.dataset.key); } });
    node.addEventListener("mouseleave",()=>{ if(!pinned){
      graphHover=null; clear(); clearRowHighlight(); } });
    node.addEventListener("click",(e)=>{ if(e&&e.stopPropagation)e.stopPropagation();
      const me={kind:node.dataset.kind,key:node.dataset.key};
      const same=graphPin&&graphPin.kind===me.kind&&graphPin.key===me.key;
      setPin(same?null:me); });   // 같은 노드 재클릭 → 해제, 다른 노드 → 재고정
  });
  svg.addEventListener("click",()=>{ if(graphPin) setPin(null); });   // 빈 배경 클릭 → 해제

  // 재렌더(5초 폴링/필터 변경/F5) 후 고정 복원: 같은 (kind,key) 노드가 아직 있으면
  // 다시 pin + 배치 적용. 노드가 잠시 사라져도(필터/스냅샷 변화) graphPin 은 유지 —
  // 명시적 해제(배경/재클릭) 전까지는 노드가 돌아오면 다시 고정된다.
  if(graphPin){
    const n=nodeOf(graphPin.kind, graphPin.key);
    if(n){ pinned=n; apply(n); }
  } else if(graphHover){
    // pin 이 없을 때만 hover 복원(pin 우선). 노드가 사라졌으면 hover 상태 폐기.
    const hn=nodeOf(graphHover.kind, graphHover.key);
    if(hn){ apply(hn); highlightRows(graphHover.kind, graphHover.key); }
    else graphHover=null;
  }
}

function render(snap){
  const s = snap.summary||{};
  const ll = snap.litellm;
  // 수집 상태 배너: 초기 로딩 / 백그라운드 수집 실패를 화면에 노출한다.
  const banner = $("#banner");
  if(snap.loading){
    banner.innerHTML = '<div class="note-banner">⏳ 첫 스냅샷 수집 중…'
      + (snap.error ? ' ('+esc(snap.error)+')' : '') + '</div>';
    $("#updated").textContent = "loading…";
    $("#livedot").style.background = "var(--warn)";
    return;
  }
  // 수집 신뢰도 배너를 누적한다(여러 문제가 동시에 날 수 있음):
  //  1) 백그라운드 수집 실패(직전 스냅샷 서빙 중)
  //  2) LiteLLM 게이트웨이 미도달 — 최상류 단일 의존성이라 별도 강조
  //  3) k8s/GPU 수집 오류 총계 — 셀마다 hover 하지 않아도 규모가 보이게
  let bhtml = "";
  if(snap.collect_error){
    bhtml += '<div class="err">⚠ 백그라운드 수집 실패(직전 스냅샷 표시 중): '
      + esc(snap.collect_error) + '</div>';
  }
  if(ll && ll.reachable === false){
    bhtml += '<div class="err">⚠ LiteLLM 게이트웨이 미도달 — 모델 목록·상태를 '
      + '갱신할 수 없습니다(표시 데이터가 낡았을 수 있음).</div>';
  }
  const kerr = (s.k8s_errors||0), gerr = (s.gpu_errors||0);
  if(kerr || gerr){
    const segs = [];
    if(kerr) segs.push("backend Pod 수 "+kerr+"건");
    if(gerr) segs.push("GPU 정보 "+gerr+"건");
    bhtml += '<div class="note-banner">⚠ 수집 오류 '+segs.join(" · ")
      + ' — 해당 행 수치가 부정확할 수 있음(셀 ⚠ 에 원인).</div>';
  }
  banner.innerHTML = bhtml;
  lastSnap = snap;
  // summary cards
  let cards = "";
  // 등급 카드와 수치 카드의 게이트는 **다르다**. per-user 뷰의 summary 모드는
  // 등급만 오고 처리중/대기/KV 는 오지 않는다 — 한 플래그로 묶으면 그 모드에서
  // 카드가 통째로 사라져 "부하를 아예 모른다"처럼 보인다.
  if(s.load_state_known || s.load_known){
    const busy=s.models_busy||0, sat=s.models_saturated||0;
    cards += card("지금 바쁜 모델",
      busy+'<span style="color:var(--faint);font-size:16px"> / '
      +(s.models_load_total||0)+'</span>',
      sat?"bad":(busy?"warn":"good"),
      s.busiest ? esc(s.busiest.model_name)+" · "+esc(s.busiest.reason||"")
                : "큐 없음 · 여유");
  }
  if(s.load_known){
    cards += card("처리 중", s.running||0, (s.running?"good":""), "in-flight 요청 합");
    cards += card("대기", s.queued||0, (s.queued?"bad":""),
      s.queued? "지금 기다리는 요청" : "대기 없음");
    if(s.kv_max_pct!=null)
      cards += card("KV 최대", Math.round(s.kv_max_pct)+"%",
        s.kv_max_pct>=95?"bad":(s.kv_max_pct>=80?"warn":"good"), "가장 붐비는 Pod");
  }
  // per-user 뷰: 맨 앞에 "내 키" 카드(접근 모델 수 / spend·예산 / rate limit·만료)
  if(snap.user_view){
    const ki = snap.key_info || {};
    cards += card("내 접근 모델", (snap.accessible_count||0), "accent",
      ki.key_alias ? esc(ki.key_alias) : "내 키 기준");
    if(ki.spend!=null || ki.max_budget!=null){
      const sp = ki.spend!=null ? "$"+fmtNum(ki.spend) : "—";
      let sub = "&nbsp;";
      if(ki.max_budget!=null){
        const rem = ki.spend!=null ? (ki.max_budget - ki.spend) : null;
        sub = "예산 $"+fmtNum(ki.max_budget)
            + (rem!=null ? " · 잔액 $"+fmtNum(rem) : "");
      }
      cards += card("Spend", sp, "", sub);
    }
    if(ki.tpm_limit!=null || ki.rpm_limit!=null || ki.expires){
      const tpm = ki.tpm_limit!=null ? fmtNum(ki.tpm_limit) : "∞";
      const rpm = ki.rpm_limit!=null ? fmtNum(ki.rpm_limit) : "∞";
      const exp = ki.expires ? "만료 "+esc(String(ki.expires).slice(0,10)) : "";
      cards += card("Rate limit",
        tpm+'<span style="color:var(--faint);font-size:14px"> tpm</span>',
        "", "rpm "+rpm+(exp?" · "+exp:""));
    }
  }
  cards += card("Model Groups", s.model_groups||0, "accent");
  cards += card("Registered", s.deployments_registered||0, "");
  cards += card("Running (healthy)", s.deployments_healthy||0, "good",
    "unhealthy "+(s.deployments_unhealthy||0));
  // 일시중지 카드는 실제로 꺼둔 게 있을 때만 — 평상시 대시보드에 0 카드를 늘려
  // 시선을 뺏지 않는다. healthy/unhealthy 어디에도 안 잡히므로 이 카드가 없으면
  // "Registered 는 10인데 healthy+unhealthy 가 8" 인 차이를 설명할 길이 없다.
  if(s.deployments_blocked)
    cards += card("Paused (비활성)", s.deployments_blocked, "accent",
      "관리자가 트래픽 차단");
  if(s.backend_pods_known)
    cards += card("Replicas", (s.backend_pods_ready||0)
      +'<span style="color:var(--faint);font-size:16px"> / '
      +(s.backend_pods_desired||"?")+'</span>', "",
      "LB 뒤 ready / desired");
  // GPU 카드는 전체(admin) 뷰에서만 — per-user 뷰는 내부정보로 숨김.
  // 혼합 GPU 는 세그먼트 바 + 범례로 비중을 보여준다.
  if(s.gpu_known && !snap.user_view){
    const gp=s.gpu_products||{};
    const sub = Object.keys(gp).length
      ? '<div class="sub gpusub">'+gpuBar(gp)+'</div>' : '<div class="sub">장치 미상</div>';
    cards += '<div class="card"><div class="label">GPU</div>'
      +'<div class="val gpuval">'+(s.gpu_total||0)+'</div>'+sub+'</div>';
  }
  $("#cards").innerHTML = cards;

  // deployments
  const showBk = !!snap.backend_count_enabled;
  const uHide = !!snap.user_view;   // per-user 뷰는 내부 컬럼(MODE/SRC/API_BASE) 숨김
  const showGpu = !!s.gpu_known && !uHide;   // GPU 컬럼도 내부정보 — user 뷰 숨김
  // 부하 컬럼은 per-user 뷰에도 보여준다(내부 토폴로지가 아니라 "지금 쓸 수 있나" 정보).
  // Pod 주소가 담긴 툴팁만 uHide 로 가린다(loadCell/podTip).
  // 부하는 per-user 뷰에도 보여준다 — 내부 토폴로지가 아니라 "지금 이 모델을
  // 쓸 수 있나"의 답이다. 리댁션은 평탄한 스칼라만 남기므로(Pod 주소 제외)
  // loadOf 가 같은 모양으로 되돌린다.
  const showLoad = !!snap.load_enabled;
  renderLoadAge(snap);
  const leastBusy = String(snap.load_routing||"least-busy") !== "shuffle";
  const dt = $("#deployments");
  // status/net/engine 필터는 표와 그래프에 똑같이 적용한다(그래프도 필터된 집합만 그림).
  const fS = $("#f-status").value, fN = $("#f-net").value, fE = $("#f-eng").value;
  // model_name 검색: 대소문자 무시 부분일치. 표·그래프에 status/net/eng 와 함께 적용된다.
  const fQ = ($("#f-search").value||"").trim().toLowerCase();
  // status 필터: '!UP'(이상만)은 DOWN·? 를 한 번에, 그 외엔 정확히 일치.
  // '이상만' 은 장애 트리아지용이라 PAUSED(의도적으로 꺼둔 것)는 빼고 본다 —
  // 안 그러면 운영자가 일부러 중지한 모델이 매번 장애 후보로 섞여 올라온다.
  const stOk = d => !fS || (fS==="!UP"
    ? ((d.status||"?")!=="UP" && (d.status||"?")!=="PAUSED")
    : (d.status||"?")===fS);
  // 검색은 model_name 뿐 아니라 백엔드(service 라벨·api_base)도 매칭 — 운영자는
  // svc 이름(*-predictor)으로 찾는 일이 많다. per-user 뷰는 리댁션돼 ref 라벨로 매칭.
  const hayOf = d => (String(d.model_name||"")+" "+svcLabelOf(d)+" "
    +String(d.api_base||"")).toLowerCase();
  const filterDep = d => stOk(d)
    && (!fN || netOf(d)===fN) && (!fE || engOf(d)===fE)
    && (!fQ || hayOf(d).includes(fQ));
  // 필터 전 **전체** deployment 목록. sharedMap/pausedMap 은 "필터로 화면에서만
  // 빠진 sibling" 까지 봐야 정확하므로 반드시 이 목록으로 계산한다. 그래프는 아래
  // 표 블록 **밖에서** 그리므로 함수 스코프에 둔다 — 블록 지역(const)으로 두면
  // pausedMap(all) 이 ReferenceError 로 죽고, render 를 감싼 폴링 try/catch 가
  // 그것을 "수집 실패" 로 위장해 그래프가 조용히 사라진다(회귀 있었음).
  const all = (ll && ll.deployments) || [];
  let graphDeps = [];   // 그래프가 그릴 deployment(= 표와 동일한 필터 결과)
  if(all.length){
    const merged = all.filter(filterDep);
    graphDeps = merged;   // 그래프는 (status/net/eng) 필터 결과 전체를 그린다 — pin 으로 좁히지 않음
    // 그래프 노드 클릭(pin) 시: 표만 그 노드로 좁힌다(그래프는 유지 → 다른 노드로 이동 가능).
    // 핀이 현재 필터 결과에 실제 존재할 때만 좁히고, 없으면(필터로 빠졌거나 스냅샷에서 사라짐)
    // 표를 비우지 않고 전체를 보여준다 — wireGraph 의 pin 복원 태도와 동일.
    let tableDeps = merged, pinActive = false, pinLabel = "";
    if(graphPin){
      const hit = merged.filter(d=>depMatchesPin(d, graphPin));
      if(hit.length){ tableDeps = hit; pinActive = true;
        pinLabel = graphPin.kind==="m" ? hit[0].model_name : svcLabelOf(hit[0]); }
    }
    updatePinBadge(pinActive, pinLabel);
    $("#f-count").textContent = (fS||fN||fE||fQ)
      ? merged.length+" / "+all.length : all.length+"";
    let head = "<tr><th>STATUS</th><th>MODEL_NAME</th>";
    if(showLoad) head += '<th title="지금 부하 — 등급 · 근거 · 처리중+대기 · KV">LOAD</th>';
    head += "<th>TYPE</th>";
    if(showBk) head += '<th>REPLICAS (ready/desired)</th>';
    if(showBk && showGpu) head += '<th>GPU</th>';
    if(showBk && !uHide) head += '<th>MODE</th><th>SRC</th>';
    if(!uHide) head += "<th>API_BASE</th>";
    head += "</tr>";
    const ncol = 3 + (showLoad?1:0) + (showBk?1:0) + (showBk&&showGpu?1:0)
      + (showBk&&!uHide?2:0) + (uHide?0:1);
    dt.querySelector("thead").innerHTML = head;
    // per-user 뷰(uHide)는 내부 컬럼을 숨긴 평면 행으로 그린다(그룹핑은 admin 전용).
    // 그래프는 익명 backend_ref 기반으로 per-user 뷰에서도 그린다(아래 showGraph).
    // backend 노드를 pin 하면 그 Service 하나만 남기는데, 그룹 뷰로 그리면 각 모델 그룹의
    // 헤더 집계(nbk·Σ replicas·상태)가 "그 backend 하나"만으로 계산돼 실제 규모를 왜곡한다.
    // → backend pin 일 때는 평면 행으로 그려 행별 실측값(status/replicas/GPU)만 정직하게 보인다.
    const grouped = $("#f-group").checked && !uHide
      && !(pinActive && graphPin.kind==="b");
    let body;
    if(!tableDeps.length){   // pinActive 면 hit.length>0 이라 여기 안 옴 — merged 가 빈 경우만
      const emptyMsg = fQ ? '“'+esc(fQ)+'” 검색 결과 없음' : '필터 결과 없음';
      body = '<tr><td class="empty" colspan="'+ncol+'">'+emptyMsg+'</td></tr>';
    } else if(grouped){
      // model_name 으로 묶어 표시. 공유 백엔드(여러 모델이 한 Service)는 SHARED 로
      // 명시하고, 헤드라인 Pod 합계(summary)는 이미 Service 기준 dedup 됨.
      body = groupedRows(tableDeps, sharedMap(all), showBk, showGpu, showLoad,
                         uHide, leastBusy);
    } else {
      body = tableDeps.map(d=>{
        let row = '<tr data-model="'+attrId(d.model_name)+'" data-svc="'+attrId(svcKeyOf(d))+'"><td>'
          +statusPill(d.status||"?",d)+"</td>"
          +'<td class="name">'+esc(d.model_name)+"</td>"
          + (showLoad ? "<td>"+loadCell(d,uHide)+"</td>" : "")
          +'<td>'+typeChips(netOf(d),engOf(d))+"</td>";
        if(showBk) row += "<td>"+backendCell(d)+"</td>";
        if(showBk && showGpu) row += "<td>"+gpuCell(d)+"</td>";
        if(showBk && !uHide) row +=
          '<td class="mono" style="font-size:12px;color:var(--muted)">'+esc(d.mode||"-")+"</td>"
          +'<td class="srccol">'+esc(d.backend_source||"-")+"</td>";
        if(!uHide) row += '<td class="api" title="'+esc(d.api_base)+'\n(클릭하여 복사)">'
          +esc(d.api_base||"-")+"</td>";
        row += "</tr>";
        return row;
      }).join("");
    }
    dt.querySelector("tbody").innerHTML = body;
  } else {
    $("#f-count").textContent="";
    updatePinBadge(false,"");   // deployment 없음 — 이전 뷰의 pin 칩 잔류 금지
    dt.querySelector("thead").innerHTML="";
    dt.querySelector("tbody").innerHTML='<tr><td class="empty">deployment 없음 (LiteLLM /model/info 응답 비어있음 또는 미연결)</td></tr>';
  }
  $("#dep-err").innerHTML = (ll && ll.errors && ll.errors.length)
    ? ll.errors.map(e=>'<div class="err">! '+esc(e)+'</div>').join("") : "";

  // Model ↔ Backend 그래프 — 표와 같은 필터(graphDeps)를 좌측 컬럼에 그린다(추가 수집 없음).
  // per-user 뷰에서도 항상 그린다: Service 이름은 리댁션되지만 익명 backend_ref 로
  // 노드/공유(⇄) 토폴로지가 유지된다(목록이 단순해도 그래프는 표시).
  // 그래프가 숨겨지면 split 에 no-graph 를 붙여 표가 컬럼 전체 폭을 차지하게 한다.
  const split = $("#topo-split"), gcol = $("#graph-col"), gwrap = $("#graphwrap");
  const glbl = $("#f-graph-lbl");
  const hasDeps = !!(ll && ll.deployments && ll.deployments.length);
  if(glbl) glbl.style.display = "";
  const showGraph = hasDeps && $("#f-graph").checked;
  if(showGraph){
    gcol.style.display = "";
    split.classList.remove("no-graph");
    gwrap.innerHTML = graphDeps.length
      ? buildGraph(graphDeps, pausedMap(all))
      : '<div class="empty">필터 결과 없음</div>';
    const svg = gwrap.querySelector("svg");
    if(svg) wireGraph(svg);
  } else {
    hideGraph();   // 그래프 숨김(표가 전체 폭) + 이전 SVG/리스너 정리
  }

  // groups — 기본 접힘 섹션. 접혀 있어도 개수는 summary 뱃지로 보이게 한다.
  const gt = $("#groups"), gc = $("#groups-count");
  if(ll && ll.groups && ll.groups.length){
    if(gc) gc.textContent = ll.groups.length;
    gt.querySelector("thead").innerHTML="<tr><th>MODEL_GROUP</th><th>PROVIDERS</th><th>MODE</th></tr>";
    gt.querySelector("tbody").innerHTML = ll.groups.map(g=>
      '<tr><td class="name">'+esc(g.model_group)+"</td>"
      +'<td class="mono" style="color:var(--muted)">'+esc((g.providers||[]).join(", ")||"-")+"</td>"
      +"<td>"+esc(g.mode||"-")+"</td></tr>").join("");
  } else {
    if(gc) gc.textContent = "0";
    gt.querySelector("thead").innerHTML="";
    gt.querySelector("tbody").innerHTML='<tr><td class="empty">model group 없음</td></tr>';
  }

  // 키 필수 모드: export(JSON/정지페이지) 버튼은 admin 키로 본 전체 뷰일 때만 노출.
  // 비-admin 키에는 대신 "내 뷰 JSON"(지금 렌더 중인 필터된 스냅샷 다운로드)을 노출.
  if(USER_VIEW){
    const show = snap.admin_view ? "" : "none";
    const ej=$("#exp-json"), eh=$("#exp-html"), uj=$("#exp-user-json");
    if(ej) ej.style.display=show; if(eh) eh.style.display=show;
    if(uj) uj.style.display = snap.admin_view ? "none" : "";
  }
  if(snap.version) $("#ver").textContent = "v"+snap.version;
  $("#foot").textContent = "model_monitor v"+(snap.version||"?");
  // 갱신 멈춤 표시: auto-refresh 가 켜져 있는데(=계속 새 스냅샷이 와야 하는데)
  // ts 가 폴링 3주기(최소 15초) 넘게 그대로면 서버 수집이 멈춘 것 — 명시 경고.
  const stall = staleMs(snap);
  snapStale = $("#auto").checked && stall > Math.max(REFRESH_MS*3, 15000);
  const upd = $("#updated");
  upd.textContent = (snap.ts||"") + (snap.demo?"  (demo)":"")
    + (snapStale ? "  · ⚠ "+fmtAgo(stall)+"째 갱신 없음" : "");
  upd.title = snapStale
    ? "폴링은 성공하지만 서버가 새 스냅샷을 만들지 못하고 있습니다 — 표시 데이터가 낡았을 수 있음"
    : "";
}

function showUvError(msg){
  // fail-closed: 키 검증 실패 시 절대 global 뷰로 폴백하지 않는다 — 화면을 비우고 에러만.
  lastSnap = null;
  $("#banner").innerHTML = '<div class="err">⚠ 내 모델 보기 실패: '+esc(msg)
    + ' — 키를 확인하세요. (전체 뷰로 폴백하지 않습니다)</div>';
  $("#cards").innerHTML = "";
  $("#f-count").textContent = "";
  updatePinBadge(false,"");   // 표를 비우는 화면 — pin 칩도 잔류 금지
  const dt=$("#deployments");
  dt.querySelector("thead").innerHTML="";
  dt.querySelector("tbody").innerHTML=
    '<tr><td class="empty">키 검증 실패 — 표시할 데이터 없음</td></tr>';
  $("#dep-err").innerHTML = "";
  hideGraph();   // fail-closed: 이전 뷰의 라우팅 그래프도 남기지 않는다
  hideExports(); // 이전 뷰의 export/내 뷰 JSON 버튼도 잔류 금지
  const gt=$("#groups");
  gt.querySelector("thead").innerHTML="";
  gt.querySelector("tbody").innerHTML='<tr><td class="empty">—</td></tr>';
  const gc=$("#groups-count"); if(gc) gc.textContent="0";
  setUvStatus("키 검증 실패", "bad");
}

let ticking=false;
async function tick(){
  // 정지 스냅샷(/snapshot.html)으로 열렸으면 폴링 없이 박제된 데이터만 렌더한다.
  if(window.__SNAPSHOT__){
    render(window.__SNAPSHOT__);
    $("#livedot").style.background = "var(--warn)";
    document.querySelectorAll(".exp").forEach(e=>e.style.display="none");
    const ub=$("#userbar"); if(ub) ub.style.display="none";  // 정지 페이지는 global 전용
    const a=$("#auto"); if(a){ a.checked=false; a.disabled=true; }
    const u=$("#updated"); if(u) u.textContent += "  · saved snapshot (frozen)";
    return;
  }
  // 숨긴(백그라운드) 탭에선 폴링하지 않는다 — 서버 부하·불필요한 per-user POST 방지.
  // 다시 보이면 visibilitychange 리스너가 즉시 tick() 해 최신으로 따라잡는다.
  if(document.hidden) return;
  // 키 필수 모드: 키가 없으면 무인증 호출을 아예 하지 않고 안내만.
  if(USER_VIEW && !uvActive()){
    showNeedKey();
    $("#livedot").style.background = "var(--warn)";
    return;
  }
  // 이전 폴링이 아직 진행 중이면 겹쳐 쏘지 않는다(느린 응답 시 요청 누적 → 스레드·CPU
  // 경합 → ingress 502 방지). setInterval 은 in-flight 여부를 모르므로 여기서 막는다.
  if(ticking) return;
  ticking = true;
  // 폴링 주기보다 오래 끌면 client 측에서 중단해 누적을 끊는다(서버 timeout 과 별개).
  const ac = new AbortController();
  const abortTimer = setTimeout(()=>ac.abort(), Math.max(8000, REFRESH_MS*3));
  try{
    let snap;
    if(uvActive()){
      // 키는 헤더 전용(쿼리 금지). 매 요청에 실어 보내고 서버는 저장하지 않는다.
      const r = await fetch(BASE_PATH+"/api/snapshot/user",
        {method:"POST", cache:"no-store", signal: ac.signal,
         headers:{"X-LiteLLM-Key": uvKey()}});
      snap = await r.json().catch(()=>({}));
      if(!r.ok){
        showUvError((snap && snap.error) ? snap.error : ("HTTP "+r.status));
        $("#livedot").style.background = "var(--down)";
        return;
      }
      setUvStatus(snap.admin_view ? "관리자 전체 뷰"
        : "내 모델만 보는 중 ("+(snap.accessible_count||0)+"개)", "ok");
    } else {
      // 레거시(키 필수 OFF): 무인증 global 뷰.
      const r = await fetch(BASE_PATH+"/api/snapshot",{cache:"no-store", signal: ac.signal});
      snap = await r.json();
    }
    render(snap);
    // 갱신 멈춤(render 가 판정)이면 초록 대신 주황 — "연결은 되는데 데이터가 낡음".
    $("#livedot").style.background = snapStale ? "var(--warn)" : "var(--up)";
  }catch(e){
    $("#livedot").style.background = "var(--down)";
    $("#updated").textContent = (e && e.name==="AbortError")
      ? "수집 지연(응답이 느려 중단) — 다음 주기에 재시도" : "수집 실패: "+e;
  }finally{
    clearTimeout(abortTimer);
    ticking = false;
  }
}

let timer=null;
function loop(){ if(window.__SNAPSHOT__) return;   // frozen: 폴링 안 함
  if(timer) clearInterval(timer);
  if($("#auto").checked){ timer=setInterval(tick, REFRESH_MS); } }
$("#auto").addEventListener("change", ()=>{ loop(); if($("#auto").checked) tick(); });
// 탭이 다시 보이면 즉시 갱신(숨김 중엔 tick 이 폴링을 건너뜀 — 위 tick 참조).
// auto-refresh 를 사용자가 껐다면 그 의사를 존중해 여기서도 갱신하지 않는다.
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && $("#auto").checked) tick(); });
// 필터 변경: 재수집 없이 마지막 스냅샷으로 즉시 다시 렌더 + sessionStorage 저장(F5 복원).
// 검색은 타이핑마다(input) 즉시 반영 — 재수집 없이 표·그래프를 함께 좁힌다.
function onFilterChange(){ saveFilters(); if(lastSnap) render(lastSnap); }
$("#f-search").addEventListener("input", onFilterChange);
$("#f-status").addEventListener("change", onFilterChange);
$("#f-net").addEventListener("change", onFilterChange);
$("#f-eng").addEventListener("change", onFilterChange);
$("#f-group").addEventListener("change", onFilterChange);
// 그래프를 끄면(pin 조작 수단이 사라지므로) 표를 좁힌 pin 도 함께 해제한다.
$("#f-graph").addEventListener("change", ()=>{
  if(!$("#f-graph").checked && graphPin){ graphPin=null; saveGraphPin(); }
  onFilterChange(); });
// API_BASE 셀 클릭 → 전체 주소 복사(셀이 말줄임(…)되어 드래그 복사가 어렵다).
// http(비보안 컨텍스트) 배포엔 clipboard API 가 없어 execCommand 폴백을 둔다.
function copyText(t){
  if(navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{ const ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy") ? res() : rej(new Error("copy")); }
    catch(e){ rej(e); } finally{ ta.remove(); } });
}
$("#deployments").addEventListener("click", (e)=>{
  const td=e.target.closest("td.api"); if(!td) return;
  const v=(td.textContent||"").trim(); if(!v || v==="-") return;
  copyText(v).then(()=>{ td.classList.add("copied");   // 셀 잠깐 초록 = 복사됨
    setTimeout(()=>td.classList.remove("copied"), 900); }).catch(()=>{});
});
// 📌 pin 칩 클릭 → pin 해제(표 전체 복원). 칩은 매 렌더마다 새로 그려지므로 위임으로 1회만.
$("#load-refresh").addEventListener("click", refreshLoadNow);
$("#dep-label").addEventListener("click", (e)=>{
  if(e.target.closest("#pin-badge") && graphPin){
    graphPin=null; saveGraphPin(); if(lastSnap) render(lastSnap); } });
// "/" 로 검색창 포커스 — 모델이 많을 때 마우스 없이 바로 탐색(입력/선택 중이면 무시).
document.addEventListener("keydown", (e)=>{
  if(e.key!=="/" || e.ctrlKey || e.metaKey || e.altKey) return;
  const t=document.activeElement, tag=t&&t.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(t&&t.isContentEditable)) return;
  const sb=$("#f-search"); if(sb){ e.preventDefault(); sb.focus(); sb.select(); }
});
// Esc: 검색어가 있으면 먼저 그것을 지우고(표·그래프 복원), 없으면 pin 해제.
// (그래프 노드가 키보드 접근이 안 되므로 좁힘을 되돌릴 탈출구를 항상 제공.)
document.addEventListener("keydown", (e)=>{
  if(e.key!=="Escape") return;
  const sb=$("#f-search");
  if(sb && sb.value){ sb.value=""; onFilterChange(); return; }
  if(graphPin){ graphPin=null; saveGraphPin(); if(lastSnap) render(lastSnap); } });

// 키 필수 모드: 키 입력 바 노출 + 조회/지우기/Enter, export 는 admin 키 헤더로.
if(USER_VIEW){
  $("#userbar").style.display = "";
  // 초기엔 export 버튼 숨김(admin 뷰가 로드되면 render 가 노출).
  const ej=$("#exp-json"), eh=$("#exp-html");
  if(ej) ej.style.display="none"; if(eh) eh.style.display="none";
  const keyInput = $("#uv-key");
  keyInput.value = uvKey();   // 같은 탭 내 새로고침 시 복원(sessionStorage)
  // 키는 "조회"(또는 Enter) 시에만 저장·전송한다(타이핑 중 부분키 조회 방지).
  function submitKey(){
    const v = keyInput.value.trim();
    if(!v){ setUvStatus("키를 입력하세요", "bad"); keyInput.focus(); return; }
    sessionStorage.setItem(UV_KEY, v);   // 탭 닫으면 소멸
    tick();
  }
  $("#uv-go").addEventListener("click", submitKey);
  keyInput.addEventListener("keydown", e=>{ if(e.key==="Enter") submitKey(); });
  $("#uv-clear").addEventListener("click", ()=>{
    sessionStorage.removeItem(UV_KEY); keyInput.value=""; tick();
  });
  if(ej) ej.addEventListener("click", e=>{ e.preventDefault();
    exportWithKey("/snapshot.json", false); });
  if(eh) eh.addEventListener("click", e=>{ e.preventDefault();
    exportWithKey("/snapshot.html", true); });
  // 내 뷰 JSON: 서버 재요청 없이 지금 렌더 중인 per-user 스냅샷(lastSnap)을
  // 그대로 파일로 저장 — /api/snapshot/user 응답과 동일해 디버그/문의에 첨부 가능.
  const uj=$("#exp-user-json");
  if(uj) uj.addEventListener("click", e=>{ e.preventDefault();
    if(!lastSnap) return;
    const b=new Blob([JSON.stringify(lastSnap,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(b), a=document.createElement("a");
    a.href=u; a.download="model-monitor-user-snapshot.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 15000);
  });
}
loadFilters();   // F5 복원: 저장된 필터를 첫 렌더 전에 되살린다(pin 복원과 짝)
tick(); loop();
</script>
</body>
</html>
